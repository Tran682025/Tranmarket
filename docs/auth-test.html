<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pi Wallet Auth · Test</title>

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      background: #020018;
      color: #f5f6ff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box {
      max-width: 480px;
      width: 100%;
      padding: 24px 20px;
      border-radius: 16px;
      background: #080024;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }
    p {
      margin: 0 0 16px;
      font-size: 14px;
      color: #b7bce6;
    }
    #pi-login {
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Pi Wallet Auth · Test</h1>
    <p>Trang này dùng chung file <code>auth/pi-auth.js</code> để test đăng nhập ví Pi.</p>
    <div id="pi-login">[Pi login component loading…]</div>
  </div>

  <!-- Gắn script auth -->
  <script src="auth/pi-auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (typeof initPiLogin === "function") {
        console.log("[Tranmarket TEST] calling initPiLogin from auth-test.html");
        initPiLogin();
      } else {
        console.error("initPiLogin() not found on window");
        document.getElementById("pi-login").textContent =
          "[ERROR] initPiLogin() not found. Check auth/pi-auth.js";
      }
    });
  </script>
</body>
</html>
