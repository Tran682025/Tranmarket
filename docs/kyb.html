<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tranmarket – Business KYB Onboarding</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="kyb-style.css" />
</head>
<body>
  <div class="tm-header">
    <div class="tm-logo">
        <img src="trm-logo-nav.png" alt="Tranmarket" class="tm-logo-img" />
        <span>Tranmarket</span>
    </div>

    <div class="tm-lang-switcher">
      <button type="button" class="lang-btn active" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="cs">CZ</button>
      <button type="button" class="lang-btn" data-lang="vi">VI</button>
    </div>
  </header>

  <main class="tm-main">
    <section class="tm-intro">
      <h1 data-i18n="pageTitle">Business onboarding</h1>
      <p data-i18n="pageSubtitle">Fill this form to submit your KYB profile for Tranmarket.</p>
    </section>

    <form id="kyb-form" class="tm-form">
      <!-- Business details -->
      <section class="tm-section">
        <h2 data-i18n="sectionBusinessDetails">Business details</h2>
        <div class="tm-field">
          <label data-i18n="businessTypeLabel">Business type</label>
          <select id="businessType" name="businessType" required>
            <option value="" data-i18n="selectPlaceholder">Select…</option>
            <option value="individual_service_provider" data-i18n="businessTypeIndividual">Individual service provider</option>
            <option value="registered_company" data-i18n="businessTypeCompany">Registered company</option>
            <option value="nonprofit_or_organization" data-i18n="businessTypeNonprofit">Nonprofit or organization</option>
          </select>
        </div>

        <div class="tm-field">
          <label data-i18n="legalNameLabel">Legal name</label>
          <input id="legalName" type="text" required />
        </div>

        <div class="tm-field">
          <label data-i18n="tradingNameLabel">Trading name (optional)</label>
          <input id="tradingName" type="text" />
        </div>

        <div class="tm-field">
          <label data-i18n="registrationNumberLabel">Registration number (optional)</label>
          <input id="registrationNumber" type="text" />
        </div>

        <div class="tm-field">
          <label data-i18n="taxIdLabel">Tax ID (optional)</label>
          <input id="taxId" type="text" />
        </div>
      </section>

      <!-- Jurisdiction -->
      <section class="tm-section">
        <h2 data-i18n="sectionJurisdiction">Jurisdiction</h2>
        <div class="tm-grid">
          <div class="tm-field">
            <label data-i18n="countryLabel">Country</label>
            <input id="country" type="text" required />
          </div>
          <div class="tm-field">
            <label data-i18n="stateRegionLabel">State / region (optional)</label>
            <input id="stateRegion" type="text" />
          </div>
        </div>

        <div class="tm-grid">
          <div class="tm-field">
            <label data-i18n="cityLabel">City</label>
            <input id="city" type="text" required />
          </div>
          <div class="tm-field">
            <label data-i18n="postalCodeLabel">Postal code</label>
            <input id="postalCode" type="text" required />
          </div>
        </div>

        <div class="tm-field">
          <label data-i18n="addressLine1Label">Address line 1</label>
          <input id="addressLine1" type="text" required />
        </div>

        <div class="tm-field">
          <label data-i18n="addressLine2Label">Address line 2 (optional)</label>
          <input id="addressLine2" type="text" />
        </div>
      </section>

      <!-- Contact person -->
      <section class="tm-section">
        <h2 data-i18n="sectionContact">Contact person</h2>
        <div class="tm-grid">
          <div class="tm-field">
            <label data-i18n="contactNameLabel">Full name</label>
            <input id="contactName" type="text" required />
          </div>
          <div class="tm-field">
            <label data-i18n="contactRoleLabel">Role</label>
            <input id="contactRole" type="text" required />
          </div>
        </div>
        <div class="tm-grid">
          <div class="tm-field">
            <label data-i18n="contactEmailLabel">Email</label>
            <input id="contactEmail" type="email" required />
          </div>
          <div class="tm-field">
            <label data-i18n="contactPhoneLabel">Phone number</label>
            <input id="contactPhone" type="tel" required />
          </div>
        </div>
        <div class="tm-grid">
          <div class="tm-field">
            <label data-i18n="websiteUrlLabel">Website (optional)</label>
            <input id="websiteUrl" type="url" />
          </div>
          <div class="tm-field">
            <label data-i18n="preferredLanguageLabel">Preferred language</label>
            <select id="preferredLanguage" required>
              <option value="" data-i18n="selectPlaceholder">Select…</option>
              <option value="en">English</option>
              <option value="cs">Čeština</option>
              <option value="vi">Tiếng Việt</option>
              <option value="other" data-i18n="langOther">Other</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Service profile -->
      <section class="tm-section">
        <h2 data-i18n="sectionServiceProfile">Service profile</h2>
        <div class="tm-field">
          <label data-i18n="mainCategoryLabel">Main service category</label>
          <input id="mainCategory" type="text" required />
        </div>
        <div class="tm-field">
          <label data-i18n="subCategoriesLabel">Subcategories (comma separated)</label>
          <input id="subCategories" type="text" />
        </div>
        <div class="tm-field">
          <label data-i18n="serviceCountriesLabel">Service countries (ISO codes, comma separated)</label>
          <input id="serviceCountries" type="text" />
        </div>
        <div class="tm-checkbox-row">
          <label><input id="onlineOnly" type="checkbox" /> <span data-i18n="onlineOnlyLabel">Online only</span></label>
          <label><input id="physicalPresence" type="checkbox" /> <span data-i18n="physicalPresenceLabel">Physical presence required</span></label>
        </div>
        <div class="tm-field">
          <label data-i18n="shortDescriptionLabel">Short description</label>
          <textarea id="shortDescription" rows="2" required></textarea>
        </div>
        <div class="tm-field">
          <label data-i18n="longDescriptionLabel">Long description</label>
          <textarea id="longDescription" rows="4" required></textarea>
        </div>
      </section>

      <!-- Compliance -->
      <section class="tm-section">
        <h2 data-i18n="sectionCompliance">Compliance and declarations</h2>
        <div class="tm-checkbox-col">
          <label><input id="isUBO" type="checkbox" required /> <span data-i18n="isUBOLabel">I confirm I am the ultimate beneficial owner or an authorized representative of this business.</span></label>
          <label><input id="hasLicenses" type="checkbox" required /> <span data-i18n="hasLicensesLabel">I confirm that I hold valid licenses where required for the services I provide.</span></label>
          <label><input id="acceptsPiOnly" type="checkbox" required /> <span data-i18n="acceptsPiOnlyLabel">I agree to accept Pi payments only inside the Pi Network ecosystem on Tranmarket.</span></label>
          <label><input id="noIllegalUse" type="checkbox" required /> <span data-i18n="noIllegalUseLabel">I agree not to use Tranmarket for illegal, restricted or prohibited activities.</span></label>
          <label><input id="agreesKycKyb" type="checkbox" required /> <span data-i18n="agreesKycKybLabel">I agree that my KYB information may be reviewed for MiCA and Pi Network compliance.</span></label>
        </div>
      </section>

      <section class="tm-section tm-actions">
        <button type="submit" class="tm-btn-primary" data-i18n="submitButton">Submit KYB for review</button>
      </section>
    </form>

    <section class="tm-section tm-console-hint">
      <p data-i18n="consoleHint">Note: this prototype prints KYB data to console as JSON.</p>
    </section>
  </main>

  <script src="kyb-script.js"></script>
</body>
</html>
