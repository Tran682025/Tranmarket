<!-- docs/direct.html – Tranmarket Web3 Overview (Pi login + i18n fixed) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TRANMARKET – Web3 Overview</title>

  <meta
    name="description"
    content="Giới thiệu Tranmarket Web3 – sứ mệnh, tầm nhìn với Pi Network và cách nền tảng kết nối cộng đồng người Việt tại Séc & EU với dịch vụ uy tín."
  />

  <!-- Pi Web3 SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    :root {
      --bg-main: #020018;
      --card-bg: rgba(8, 0, 40, 0.9);
      --accent: #9f7bff;
      --accent-soft: rgba(159, 123, 255, 0.25);
      --accent-strong: #ffbb00;
      --text-main: #f5f6ff;
      --text-muted: #b7bce6;
      --radius-xl: 24px;
      --shadow-soft: 0 18px 45px rgba(0, 0, 0, 0.65);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      min-height: 100vh;
      background-color: var(--bg-main);
      background-image: url("assets/trm-logo-background.png");
      background-size: cover;
      background-position: center;
      color: var(--text-main);
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(
          circle at top,
          rgba(159, 123, 255, 0.22),
          transparent 55%
        ),
        radial-gradient(
          circle at bottom,
          rgba(255, 80, 170, 0.18),
          transparent 55%
        );
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      padding: 32px 20px 40px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Top bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 20%, #fff2, transparent 50%),
        #1b1029;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.8);
    }

    .brand-logo img {
      width: 120%;
      height: auto;
    }

    .brand-text-main {
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 14px;
      text-transform: uppercase;
    }

    .brand-text-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .lang-switch {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .lang-switch button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 999px;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .lang-switch button.active {
      background: var(--accent-soft);
      color: #ffffff;
      font-weight: 600;
    }

    #pi-login {
      font-size: 12px;
      color: var(--text-muted);
      min-width: 120px;
      text-align: right;
    }

    /* Hero */
    .hero {
      margin-top: 4px;
      padding: 26px 22px 24px;
      border-radius: var(--radius-xl);
      background: linear-gradient(
        135deg,
        rgba(7, 0, 40, 0.9),
        rgba(10, 0, 50, 0.96)
      );
      box-shadow: var(--shadow-soft);
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 2.2fr);
      gap: 24px;
      align-items: center;
    }

    .hero-main-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .hero-main-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .hero-main-desc {
      font-size: 14px;
      color: var(--text-main);
      opacity: 0.94;
      line-height: 1.5;
    }

    .hero-tagline {
      margin-top: 10px;
      font-size: 12px;
      color: var(--accent-strong);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hero-logo-wrap {
      text-align: center;
    }

    .hero-logo {
      width: 130px;
      height: 130px;
      margin: 4px auto 8px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 20%, #fff3, transparent 55%),
        #20142f;
      box-shadow: 0 0 38px rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .hero-logo img {
      width: 120%;
      height: auto;
    }

    .hero-note {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Sections */
    .section-card {
      margin-top: 6px;
      padding: 20px 20px 22px;
      border-radius: var(--radius-xl);
      background: var(--card-bg);
      box-shadow: var(--shadow-soft);
      position: relative;
      overflow: hidden;
    }

    .section-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle at top left,
        rgba(159, 123, 255, 0.16),
        transparent 55%
      );
      opacity: 0.7;
      pointer-events: none;
    }

    .section-inner {
      position: relative;
      z-index: 1;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .section-body {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-main);
      opacity: 0.96;
    }

    .section-body + .section-body {
      margin-top: 8px;
    }

    .cta-row {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn-primary,
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 18px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-primary {
      color: #ffffff;
      background: linear-gradient(90deg, #7a00ff, #ffbb00);
      box-shadow: 0 0 16px rgba(0, 0, 0, 0.7);
    }

    .btn-secondary {
      color: var(--text-main);
      background: rgba(22, 10, 60, 0.9);
      border: 1px solid rgba(159, 123, 255, 0.6);
    }

    .btn-primary span,
    .btn-secondary span {
      margin-left: 6px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.8;
    }

    footer {
      margin-top: 18px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: minmax(0, 1fr);
      }
      .hero-logo {
        width: 120px;
        height: 120px;
      }
    }

    @media (max-width: 720px) {
      .page {
        padding-inline: 14px;
      }
      .hero {
        padding: 20px 16px 18px;
      }
      .brand-text-main {
        font-size: 13px;
      }
      .brand-text-sub {
        display: none;
      }
      .top-right {
        gap: 8px;
      }
      #pi-login {
        min-width: auto;
      }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="page">
    <!-- Top bar -->
    <header class="top-bar">
      <div class="brand">
        <div class="brand-logo">
          <img src="assets/trm-logo-nav.png" alt="TRANMARKET logo" />
        </div>

          <div class="brand-text-main">TRANMARKET</div>

      <div class="top-right">
        <div class="lang-switch">
          <button id="btn-en" onclick="switchLang('en')">EN</button>
          <button id="btn-cz" onclick="switchLang('cz')">CZ</button>
          <button id="btn-vi" onclick="switchLang('vi')">VN</button>

        <!-- Placeholder – sẽ được pi-auth.js thay bằng nút Login / Logged-in -->
        <div id="pi-login"></div>

      </div>

    <!-- Hero -->
    <section class="hero">
      <div>
        <div class="hero-main-title" id="hero-title"></div>
        <div class="hero-main-sub" id="hero-sub"></div>

      <div class="hero-logo-wrap">

        </div>
        <div class="hero-note" id="hero-note"></div>
      </div>
    </section>

    <!-- Section 1 -->
    <section class="section-card">
      <div class="section-inner">
        <div class="section-title" id="sec1-title"></div>
        <p class="section-body" id="sec1-body-1"></p>
        <p class="section-body" id="sec1-body-2"></p>
      </div>
    </section>

    <!-- Section 2 -->
    <section class="section-card">
      <div class="section-inner">
        <div class="section-title" id="sec2-title"></div>
        <p class="section-body" id="sec2-body-1"></p>
        <p class="section-body" id="sec2-body-2"></p>
      </div>
    </section>

    <!-- Section 3 + CTA -->
    <section class="section-card">
      <div class="section-inner">
        <div class="section-title" id="sec3-title"></div>
        <p class="section-body" id="sec3-body-1"></p>
        <p class="section-body" id="sec3-body-2"></p>

        <div class="cta-row">
          <!-- Browse Service Directory -->
          <a href="day5-category-b.html" class="btn-primary" id="cta-dir">
            <span id="cta-dir-text"></span>
            <span class="arrow">›</span>
          </a>

          <!-- Register Service (KYB) -->
          <a href="kyb.html" class="btn-secondary" id="cta-kyb">
            <span id="cta-kyb-text"></span>
            <span class="arrow">›</span>
          </a>
        </div>
      </div>
    </section>

    <footer id="copyright"></footer>
  </div>

  <!-- I18n pack + language switch -->

    function switchLang(l) {
      const p = langPack[l];

      document.getElementById("brand-sub").innerText = p.brandSub;

      document.getElementById("hero-title").innerText = p.heroTitle;
      document.getElementById("hero-sub").innerText = p.heroSub;
      document.getElementById("hero-desc").innerText = p.heroDesc;
      document.getElementById("hero-tagline").innerText = p.heroTagline;
      document.getElementById("hero-note").innerText = p.heroNote;

      document.getElementById("sec1-title").innerText = p.sec1Title;
      document.getElementById("sec1-body-1").innerText = p.sec1Body1;
      document.getElementById("sec1-body-2").innerText = p.sec1Body2;

      document.getElementById("sec2-title").innerText = p.sec2Title;
      document.getElementById("sec2-body-1").innerText = p.sec2Body1;
      document.getElementById("sec2-body-2").innerText = p.sec2Body2;

      document.getElementById("sec3-title").innerText = p.sec3Title;
      document.getElementById("sec3-body-1").innerText = p.sec3Body1;
      document.getElementById("sec3-body-2").innerText = p.sec3Body2;

      document.getElementById("cta-dir-text").innerText = p.ctaDirText;
      document.getElementById("cta-kyb-text").innerText = p.ctaKybText;

      document.getElementById("copyright").innerText = p.copyright;

      document
        .querySelectorAll(".lang-switch button")
        .forEach(btn => btn.classList.remove("active"));
      document.getElementById("btn-" + l).classList.add("active");
    }
<script>
  // Default language = English
  switchLang("en");
</script>

<div id="pi-login"></div>

  });
</script>
