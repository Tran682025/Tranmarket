<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tranmarket – Service KYB</title>

  <style>
    :root {
      --bg: #12002b;
      --card: #25104a;
      --accent: #ff79c6;
      --accent-soft: #ffb3df;
      --text: #ffffff;
      --muted: #c0b3ff;
      --input-bg: #1a0a33;
      --border: #3a2370;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, sans-serif;
      background: radial-gradient(circle at top, #3b1c82, #050013);
      color: var(--text);
    }

    .tm-page {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 16px;
    }

    .tm-shell {
      width: 100%;
      max-width: 1100px;
      background: linear-gradient(145deg, #2b1553, #16072e);
      border-radius: 24px;
      padding: 24px 24px 32px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    header.tm-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .tm-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tm-logo-small {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      object-fit: cover;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.15);
    }

    .tm-brand-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .tm-brand-name {
      font-weight: 700;
      letter-spacing: 0.12em;
      font-size: 0.82rem;
    }

    .tm-brand-sub {
      font-size: 0.7rem;
      color: var(--accent-soft);
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }

    .tm-lang-switch {
      display: inline-flex;
      align-items: center;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 2, 40, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      gap: 2px;
    }

    .tm-lang-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
    }

    .tm-lang-btn.is-active {
      background: var(--accent);
      color: #12001c;
      font-weight: 600;
    }

    .tm-main {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1.4fr);
      gap: 24px;
    }

    @media (max-width: 880px) {
      .tm-main {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .tm-intro {
      margin-bottom: 16px;
    }

    .tm-title {
      margin: 0 0 4px;
      font-size: 1.25rem;
    }

    .tm-subtitle {
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .tm-note {
      margin-top: 12px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .tm-card {
      background: radial-gradient(circle at top left, #3e1c7a, #140521);
      border-radius: 18px;
      padding: 18px 18px 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    form#kyb-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-grid.two-col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    @media (max-width: 640px) {
      .form-grid.two-col {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.82rem;
    }

    label {
      color: var(--muted);
    }

    .input,
    .select,
    textarea {
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      padding: 8px 10px;
      font-size: 0.86rem;
      outline: none;
      width: 100%;
    }

    .input:focus,
    .select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(255, 121, 198, 0.5);
    }

    textarea {
      resize: vertical;
      min-height: 72px;
    }

    .tm-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .btn {
      border-radius: 999px;
      border: 1px solid transparent;
      padding: 8px 16px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1b0b36;
      color: var(--text);
    }

    .btn-primary {
      background: var(--accent);
      color: #160014;
      font-weight: 600;
    }

    .btn-outline {
      border-color: rgba(255, 255, 255, 0.3);
    }

    .tm-preview-card {
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .preview-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent-soft);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    pre.preview-content {
      margin: 0;
      padding: 12px;
      border-radius: 12px;
      background: #0b0319;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.78rem;
      line-height: 1.5;
      white-space: pre-wrap;
      max-height: 420px;
      overflow: auto;
    }

    .preview-hint {
      font-size: 0.76rem;
      color: var(--muted);
    }

    .pi-note {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .pi-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="tm-page">
    <div class="tm-shell">
      <header class="tm-header">
        <div class="tm-brand">
          <img
            src="../assets/trm-logo-nav.png"
            alt="Tranmarket logo"
            class="tm-logo-small"
          />
          <div class="tm-brand-text">
            <span class="tm-brand-name">TRANMARKET</span>
            <span class="tm-brand-sub" id="brand-sub"></span>
          </div>
        </div>

        <div class="tm-lang-switch">
          <button type="button" class="tm-lang-btn is-active" data-lang="vi">
            VI
          </button>
          <button type="button" class="tm-lang-btn" data-lang="en">
            EN
          </button>
          <button type="button" class="tm-lang-btn" data-lang="cs">
            CZ
          </button>
        </div>
      </header>

      <div class="tm-main">
        <!-- LEFT: FORM -->
        <section>
          <div class="tm-intro">
            <h1 class="tm-title" id="page-title"></h1>
            <p class="tm-subtitle" id="page-subtitle"></p>
            <p class="tm-note" id="form-intro"></p>
          </div>

          <div class="tm-card">
            <form id="kyb-form" autocomplete="on">
              <div class="form-grid two-col">
                <div class="field">
                  <label id="label-category" for="category"></label>
                  <select id="category" class="select"></select>
                </div>

                <div class="field">
                  <label id="label-company" for="company"></label>
                  <input id="company" class="input" type="text" />
                </div>

                <div class="field">
                  <label id="label-person" for="person"></label>
                  <input id="person" class="input" type="text" />
                </div>

                <div class="field">
                  <label id="label-area" for="area"></label>
                  <input id="area" class="input" type="text" />
                </div>

                <div class="field">
                  <label id="label-phone" for="phone"></label>
                  <input id="phone" class="input" type="text" />
                </div>

                <div class="field">
                  <label id="label-website" for="website"></label>
                  <input
                    id="website"
                    class="input"
                    type="text"
                    placeholder="https://..."
                  />
                </div>

                <div class="field">
                  <label id="label-email" for="email"></label>
                  <input id="email" class="input" type="email" />
                </div>
              </div>

              <!-- Pi-ready block -->
              <div class="field">
                <label id="label-pi-accept" for="piAccept"></label>
                <div class="pi-row">
                  <input
                    type="checkbox"
                    id="piAccept"
                    name="piAccept"
                    data-kyb-pi-accept
                  />
                  <span class="pi-note" data-kyb-pi-note></span>
                </div>
              </div>

              <div class="field">
                <label id="label-pi-level" for="piLevel"></label>
                <select
                  id="piLevel"
                  name="piLevel"
                  class="select"
                  data-kyb-pi-level
                >
                  <option value=""></option>
                  <option value="Basic"></option>
                  <option value="Standard"></option>
                  <option value="Full"></option>
                </select>
              </div>
              <!-- END Pi-ready -->

              <div class="field">
                <label id="label-desc" for="desc"></label>
                <textarea id="desc"></textarea>
              </div>

              <div class="field">
                <label id="label-notes" for="notes"></label>
                <textarea id="notes"></textarea>
              </div>

              <p class="tm-note" id="form-footer"></p>

              <div class="tm-actions">
                <button type="button" class="btn btn-primary" id="btn-mail">
                  <span id="btn-mail-text"></span>
                </button>
                <button type="button" class="btn btn-outline" id="btn-copy">
                  <span id="btn-copy-text"></span>
                </button>
                <button type="button" class="btn btn-outline" id="btn-print">
                  <span id="btn-print-text"></span>
                </button>
                <button type="button" class="btn" id="btn-reset">
                  <span id="btn-reset-text"></span>
                </button>
              </div>
            </form>
          </div>
        </section>

        <!-- RIGHT: PREVIEW -->
        <section>
          <div class="tm-card tm-preview-card">
            <div class="preview-title" id="preview-title"></div>
            <pre class="preview-content" id="preview-content"></pre>
            <div class="preview-hint" id="preview-hint"></div>
          </div>
        </section>
      </div>
    </div>
  </div>

    function getText() {
      return KYB_TEXT[currentLang];
    }

    function buildCategoryOptions() {
      const t = getText();
      els.category.innerHTML = "";
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "--";
      els.category.appendChild(placeholder);

      t.categories.forEach((c) => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        els.category.appendChild(opt);
      });
    }

    function applyLanguage(lang) {
      currentLang = lang;

      els.pageTitle.textContent = t.title;

      els.formFooter.textContent = t.formFooter;

      els.lblCompany.textContent = t.labels.company;
      els.lblPerson.textContent = t.labels.person;
      els.lblArea.textContent = t.labels.area;
      els.lblPhone.textContent = t.labels.phone;
      els.lblEmail.textContent = t.labels.email;
      els.lblWebsite.textContent = t.labels.website;
      els.lblPiAccept.textContent = t.labels.piAccept;
      els.lblPiLevel.textContent = t.labels.piLevel;
      els.lblDesc.textContent = t.labels.desc;
      els.lblNotes.textContent = t.labels.notes;

      els.btnMailText.textContent = t.buttons.mail;
      els.btnCopyText.textContent = t.buttons.copy;
      els.btnPrintText.textContent = t.buttons.print;
      els.btnResetText.textContent = t.buttons.reset;

      els.previewTitle.textContent = t.previewTitle;
      els.previewHint.textContent = t.previewHint;

      buildCategoryOptions();
      updatePiTexts();
      updatePreview();
    }

    function updatePiTexts() {
      const t = getText();

      if (els.piNote) {
        els.piNote.textContent = t.piNote;
      }

      if (els.piSelect && els.piSelect.options.length >= 4) {
        els.piSelect.options[0].textContent = t.piLevelPlaceholder;
        els.piSelect.options[1].textContent = t.piBasic;
        els.piSelect.options[2].textContent = t.piStandard;
        els.piSelect.options[3].textContent = t.piFull;
      }
    }

    function getFormValues() {
      return {
        category: els.category.value.trim(),
        company: els.company.value.trim(),
        person: els.person.value.trim(),
        area: els.area.value.trim(),
        phone: els.phone.value.trim(),
        email: els.email.value.trim(),
        website: els.website.value.trim(),
        desc: els.desc.value.trim(),
        notes: els.notes.value.trim(),
        piAccepted: !!els.piAccept.checked,
        piLevel: els.piLevel.value.trim(),
      };
    }

    function buildPreviewText() {
      const t = getText();
      const v = getFormValues();

      const lines = [];
      lines.push(t.mailBodyIntro.trim());
      lines.push("");

      lines.push(`${t.labels.category}: ${v.category || "--"}`);
      lines.push(`${t.labels.company}: ${v.company || "--"}`);
      lines.push(`${t.labels.person}: ${v.person || "--"}`);
      lines.push(`${t.labels.area}: ${v.area || "--"}`);
      lines.push(`${t.labels.phone}: ${v.phone || "--"}`);
      lines.push(`${t.labels.email}: ${v.email || "--"}`);
      lines.push(`${t.labels.website}: ${v.website || "--"}`);

      if (v.piAccepted) {
        lines.push("");
        if (currentLang === "vi") {
          lines.push("Thanh toán bằng Pi: CÓ");
        } else if (currentLang === "cs") {
          lines.push("Platba v Pi: ANO");
        } else {
          lines.push("Pi payments: ACCEPTED");
        }
        lines.push(
          `${t.labels.piLevel}: ${v.piLevel || t.piLevelPlaceholder}`
        );
      }

      lines.push("");
      lines.push(`${t.labels.desc}:`);
      lines.push(v.desc || "--");
      lines.push("");
      lines.push(`${t.labels.notes}:`);
      lines.push(v.notes || "--");

      return lines.join("\n");
    }

    function updatePreview() {
      els.previewContent.textContent = buildPreviewText();
    }

    // language switch buttons
    document
      .querySelectorAll(".tm-lang-btn")
      .forEach((btn) => {
        btn.addEventListener("click", () => {
          const lang = btn.getAttribute("data-lang");
          document
            .querySelectorAll(".tm-lang-btn")
            .forEach((b) => b.classList.remove("is-active"));
          btn.classList.add("is-active");
          applyLanguage(lang);
        });
      });

    // form change -> update preview
    [
      els.category,
      els.company,
      els.person,
      els.area,
      els.phone,
      els.email,
      els.website,
      els.desc,
      els.notes,
      els.piAccept,
      els.piLevel,
    ].forEach((el) => {
      if (!el) return;
      el.addEventListener("input", updatePreview);
      el.addEventListener("change", updatePreview);
    });

    // mail button
    els.btnMail.addEventListener("click", () => {
      const t = getText();
      const subject = encodeURIComponent(t.mailSubject);
      const body = encodeURIComponent(buildPreviewText());
      const mailto =
        "mailto:" + encodeURIComponent(KYB_EMAIL) + "?subject=" + subject + "&body=" + body;
      window.location.href = mailto;
    });

    // copy button
    els.btnCopy.addEventListener("click", async () => {
      const t = getText();
      const text = buildPreviewText();
      try {
        await navigator.clipboard.writeText(text);
        alert(t.copyOk);
      } catch (err) {
        console.warn(err);
        alert(t.copyErr);
      }
    });

    // print button
    els.btnPrint.addEventListener("click", () => {
      window.print();
    });

    // reset button
    els.btnReset.addEventListener("click", () => {
      const t = getText();
      if (!confirm(t.confirmReset)) return;
      els.form.reset();
      applyLanguage(currentLang);
    });

    // initial load
    applyLanguage(currentLang);
  </script>
</body>
</html>
