  <style>
    :root {
      --bg-body: #05001a;
      --bg-card: #1b1040;
      --bg-card-soft: #221555;
      --accent: #ff4b9a;
      --accent-soft: #ff86c0;
      --text-main: #ffffff;
      --text-muted: #c7c3ff;
      --border-soft: #3a2e7a;
      --radius-xl: 24px;
      --shadow-soft: 0 22px 45px rgba(0, 0, 0, 0.55);
      --font-main: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-main);
      background: radial-gradient(circle at top, #341a70 0, #05001a 55%, #000000 100%);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 12px;
      color: var(--text-main);
    }

    .page-wrapper {
      width: 100%;
      max-width: 980px;
    }

    .kyb-card {
      background: radial-gradient(circle at top left, #30196b, #1b1040 45%, #120930 100%);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-soft);
      padding: 28px 24px 30px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    @media (min-width: 768px) {
      .kyb-card {
        padding: 32px 34px 36px;
      }
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 18px;
    }

    .logo-wrap {
      width: 64px;
      height: 64px;
      border-radius: 22px;
      background: radial-gradient(circle at 30% 15%, #fff7e6 0, #f9b86a 32%, #4a250a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .logo-wrap img {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 18px;
    }

    .brand-text {
      flex: 1;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffe4f6;
      margin-bottom: 2px;
    }

    .brand-sub {
      font-size: 0.86rem;
      color: var(--accent-soft);
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .lang-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    .lang-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .lang-btn {
      border: 1px solid var(--border-soft);
      background: transparent;
      color: var(--text-muted);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      min-width: 40px;
      transition: all 0.15s ease-out;
    }

    .lang-btn.active {
      background: var(--accent);
      border-color: var(--accent-soft);
      color: #1b0320;
      font-weight: 600;
    }

    .card-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .card-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .card-intro {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    form {
      margin-bottom: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px 14px;
    }

    @media (min-width: 720px) {
      .form-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .form-grid .full-row {
        grid-column: 1 / -1;
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    select,
    input,
    textarea {
      border-radius: 12px;
      border: 1px solid var(--border-soft);
      background: rgba(6, 0, 40, 0.75);
      color: var(--text-main);
      padding: 8px 10px;
      font-size: 0.9rem;
      outline: none;
      width: 100%;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: var(--accent-soft);
      box-shadow: 0 0 0 1px rgba(255, 134, 192, 0.4);
    }

    textarea {
      min-height: 72px;
      resize: vertical;
    }

    .hint-text {
      margin-top: 4px;
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 10px;
    }

    .btn {
      border-radius: 999px;
      border: none;
      padding: 8px 16px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-main {
      background: linear-gradient(135deg, #ff4b9a, #ffb86c);
      color: #21061d;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
    }

    .btn-ghost {
      background: transparent;
      color: var(--accent-soft);
      border: 1px solid var(--accent-soft);
    }

    .btn-soft {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-danger {
      background: transparent;
      color: #ff9fb3;
      border: 1px solid rgba(255, 159, 179, 0.8);
    }

    .preview-card {
      margin-top: 10px;
      background: var(--bg-card-soft);
      border-radius: 18px;
      padding: 12px 14px 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.82rem;
      line-height: 1.5;
      white-space: pre-wrap;
      color: var(--text-main);
      max-height: 220px;
      overflow-y: auto;
    }

    .preview-title {
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--accent-soft);
    }

    .preview-hint {
      margin-top: 6px;
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .footer-note {
      margin-top: 14px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .footer-note strong {
      color: #ffe2ff;
      font-weight: 600;
    }

    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }
      .kyb-card {
        box-shadow: none;
        border-radius: 0;
        border: none;
        padding: 10mm 10mm 12mm;
        background: #ffffff;
        color: #000000;
      }
      .preview-card {
        background: #ffffff;
        border-color: #cccccc;
      }
      .footer-note {
        color: #333333;
      }
      .lang-toggle,
      .actions-row .btn:not(.btn-soft) {
        display: none !important;
      }
      .btn-soft {
        border: none;
        padding: 0;
      }
    }
    /* FIX LANG TOGGLE ON MOBILE */
.tm-lang-toggle {
    display: flex;
    gap: 4px;
    flex-wrap: nowrap;
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    max-width: 100%;
}
.tm-lang-toggle::-webkit-scrollbar {
    display: none;
}
.tm-lang-btn {
    border: 0;
    padding: 3px 8px;
    border-radius: 40px;
    background: transparent;
    color: var(--text-muted);
    font-size: 0.72rem;
    cursor: pointer;
}
.tm-lang-btn.active {
    background: var(--mint);
    color: #00151f;
    font-weight: 600;
}

  </style>
</head>

  <div class="page-wrapper">

        <div class="logo-wrap">

          <img src="../assets/trm-logo-hero.png" alt="Tranmarket TRM Pi logo" />
        </div>
        <div class="brand-text">

          <div class="brand-sub" id="brand-sub"></div>
        </div>
        <div class="lang-toggle">
          <span class="lang-label">Lang</span>
          <button type="button" class="lang-btn active" id="lang-vi" data-lang="vi">VI</button>
          <button type="button" class="lang-btn" id="lang-cz" data-lang="cs">CZ</button>
          <button type="button" class="lang-btn" id="lang-en" data-lang="en">EN</button>
        </div>
      </div>

      <h1 class="card-title" id="form-title"></h1>
      <div class="card-subtitle" id="form-subtitle"></div>
      <div class="card-intro" id="form-intro"></div>

      <form id="kyb-form">
        <div class="form-grid">
          <div class="field full-row">
            <label for="category" id="label-category"></label>
            <select id="category" name="category">
              <option value="" hidden>—</option>
            </select>
          </div>

          <div class="field">
            <label for="company" id="label-company"></label>
            <input type="text" id="company" name="company" />
          </div>

          <div class="field">
            <label for="person" id="label-person"></label>
            <input type="text" id="person" name="person" />
          </div>

          <div class="field">
            <label for="area" id="label-area"></label>
            <input type="text" id="area" name="area" />
          </div>

          <div class="field">
            <label for="phone" id="label-phone"></label>
            <input type="text" id="phone" name="phone" />
          </div>

          <div class="field">
            <label for="email" id="label-email"></label>
            <input type="email" id="email" name="email" />
          </div>

          <div class="field full-row">
            <label for="website" id="label-website"></label>
            <input type="text" id="website" name="website" placeholder="https://..." />
          </div>

          <div class="field full-row">
            <label for="desc" id="label-desc"></label>
            <textarea id="desc" name="desc"></textarea>
          </div>

          <div class="field full-row">
            <label for="notes" id="label-notes"></label>
            <textarea id="notes" name="notes"></textarea>
            <div class="hint-text" id="note-top"></div>
          </div>
        </div>

        <div class="actions-row">
          <button type="button" class="btn btn-main" id="btn-mail"></button>
          <button type="button" class="btn btn-soft" id="btn-copy"></button>
          <button type="button" class="btn btn-ghost" id="btn-print"></button>
          <button type="button" class="btn btn-danger" id="btn-reset"></button>
        </div>

        <div class="preview-card">
          <div class="preview-title" id="preview-title"></div>
          <pre id="preview-content"></pre>
          <div class="preview-hint" id="preview-hint"></div>
        </div>
      </form>

      <div class="footer-note" id="footer-note">
        <!-- text sẽ gán bằng JS -->
      </div>
    </div>
  </div>

      previewTitle: document.getElementById("preview-title"),
      previewContent: document.getElementById("preview-content"),
      previewHint: document.getElementById("preview-hint"),
      category: document.getElementById("category"),
      form: document.getElementById("kyb-form"),
    };

    function applyLanguage(lang) {
      currentLang = lang;
      const t = KYB_TEXT[lang];

      els.brandSub.textContent = t.brandSub;
      els.title.textContent = t.title;
      els.subtitle.textContent = t.subtitle;
      els.intro.textContent = t.formIntro;
      els.footer.textContent = t.footer;

      els.labelCategory.textContent = t.labels.category;
      els.labelCompany.textContent = t.labels.company;
      els.labelPerson.textContent = t.labels.person;
      els.labelArea.textContent = t.labels.area;
      els.labelPhone.textContent = t.labels.phone;
      els.labelEmail.textContent = t.labels.email;
      els.labelWebsite.textContent = t.labels.website;
      els.labelDesc.textContent = t.labels.desc;
      els.labelNotes.textContent = t.labels.notes;
      els.noteTop.textContent = t.noteTop;

      els.btnMail.textContent = t.buttons.mail;
      els.btnCopy.textContent = t.buttons.copy;
      els.btnPrint.textContent = t.buttons.print;
      els.btnReset.textContent = t.buttons.reset;

      els.previewTitle.textContent = t.previewTitle;
      els.previewHint.textContent = t.previewHint;

      // rebuild category options but keep current value if possible
      const prevValue = els.category.value;
      els.category.innerHTML = '<option value="" hidden>—</option>';
      t.categories.forEach((label) => {
        const opt = document.createElement("option");
        opt.value = label;
        opt.textContent = label;
        els.category.appendChild(opt);
      });
      if (t.categories.includes(prevValue)) {
        els.category.value = prevValue;
      } else if (prevValue === "") {
        els.category.value = "";
      }

      updatePreview();
    }

    function getFormValues() {
      return {
        category: els.category.value,
        company: document.getElementById("company").value.trim(),
        person: document.getElementById("person").value.trim(),
        area: document.getElementById("area").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim(),
        website: document.getElementById("website").value.trim(),
        desc: document.getElementById("desc").value.trim(),
        notes: document.getElementById("notes").value.trim(),
      };
    }

    function buildPreview() {
      const t = KYB_TEXT[currentLang];
      const v = getFormValues();
      const lines = [];

      const f = t.previewFields;

      if (v.category) lines.push(`${f.category} ${v.category}`);
      if (v.company) lines.push(`${f.company} ${v.company}`);
      if (v.person) lines.push(`${f.person} ${v.person}`);
      if (v.area) lines.push(`${f.area} ${v.area}`);
      if (v.phone) lines.push(`${f.phone} ${v.phone}`);
      if (v.email) lines.push(`${f.email} ${v.email}`);
      if (v.website) lines.push(`${f.website} ${v.website}`);
      if (v.desc) {
        lines.push("");
        lines.push(`${f.desc}`);
        lines.push(v.desc);
      }
      if (v.notes) {
        lines.push("");
        lines.push(`${f.notes}`);
        lines.push(v.notes);
      }

      return lines.join("\n");
    }

    function updatePreview() {
      els.previewContent.textContent = buildPreview();
    }

    // init listeners
    document
      .querySelectorAll(
        "#kyb-form input, #kyb-form textarea, #kyb-form select"
      )
      .forEach((el) => {
        el.addEventListener("input", updatePreview);
        el.addEventListener("change", updatePreview);
      });

    // language buttons
    document.querySelectorAll(".lang-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document
          .querySelectorAll(".lang-btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        applyLanguage(btn.dataset.lang);
      });
    });

    // copy
    els.btnCopy.addEventListener("click", async () => {
      const t = KYB_TEXT[currentLang];
      const text = buildPreview() || "";
      try {
        await navigator.clipboard.writeText(text);
        alert(t.copyOk);
      } catch (err) {
        console.warn(err);
        alert(t.copyErr);
      }
    });

    // mail
    els.btnMail.addEventListener("click", () => {
      const t = KYB_TEXT[currentLang];
      const subject = t.mailSubject;
      const body = t.mailBodyIntro + buildPreview();
      const mailto =
        "mailto:" +
        encodeURIComponent(KYB_EMAIL) +
        "?subject=" +
        encodeURIComponent(subject) +
        "&body=" +
        encodeURIComponent(body);
      window.location.href = mailto;
    });

    // print
    els.btnPrint.addEventListener("click", () => {
      window.print();
    });

    // reset
    els.btnReset.addEventListener("click", () => {
      const t = KYB_TEXT[currentLang];
      if (!confirm(t.confirmReset)) return;
      els.form.reset();
      updatePreview();
    });

    // initial
    applyLanguage("vi");
  </script>
</body>
</html>
