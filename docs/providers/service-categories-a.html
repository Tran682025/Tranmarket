  <style>
    :root {
      --bg-body: #05001a;
      --bg-panel: #130b33;
      --bg-card: #1b123f;
      --accent: #b580ff;
      --accent-strong: #e18bff;
      --mint: #3cd3c4;
      --mint-soft: #7be9dc;
      --text-main: #ffffff;
      --text-muted: #c5c2f3;
      --text-soft: #9792d6;
      --border-soft: #332a70;
      --shadow-soft: 0 24px 48px rgba(0, 0, 0, 0.65);
      --radius-card: 18px;
      --radius-icon: 10px; /* bo nhẹ kiểu C */
      --font-main: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-main);
      background:
        radial-gradient(circle at top left, #2f1e6a 0, #05001a 52%, #000000 100%);
      color: var(--text-main);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 10px 40px;
    }

    .page-wrapper {
      width: 100%;
      max-width: 1120px;
    }

    .tm-shell {
      background: radial-gradient(circle at top, #281759 0, #120927 55%, #050015 100%);
      border-radius: 26px;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 20px 18px 22px;
    }

    @media (min-width: 768px) {
      .tm-shell {
        padding: 24px 26px 28px;
      }
    }

    .tm-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .tm-logo-wrap {
      width: 60px;
      height: 60px;
      border-radius: 22px;
      background: radial-gradient(circle at 30% 10%, #fffdf5 0, #ffe7b0 28%, #723715 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .tm-logo-wrap img {
      width: 54px;
      height: 54px;
      object-fit: cover;
      border-radius: 18px;
    }

    .tm-brand-text {
      flex: 1;
      min-width: 0;
    }

    .tm-brand-name {
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fdf0ff;
      margin-bottom: 2px;
    }

    .tm-brand-sub {
      font-size: 0.86rem;
      color: var(--mint-soft);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tm-lang-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    .tm-lang-label {
      font-size: 0.78rem;
      color: var(--text-soft);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .tm-lang-btn {
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background: transparent;
      color: var(--text-soft);
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      min-width: 38px;
      transition: all 0.16s ease-out;
    }

    .tm-lang-btn.active {
      background: var(--mint);
      border-color: var(--mint-soft);
      color: #021517;
      font-weight: 600;
    }

    .tm-hero-title {
      font-size: 1.42rem;
      font-weight: 800;
      margin: 3px 0 4px;
    }

    .tm-hero-sub {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .tm-hero-note {
      font-size: 0.8rem;
      color: var(--text-soft);
      margin-bottom: 16px;
    }

    .tm-hero-note strong {
      color: var(--accent-strong);
    }

    .tm-hero-note span {
      color: var(--mint-soft);
      font-weight: 500;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 10px;
    }

    @media (min-width: 640px) {
      .category-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 980px) {
      .category-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    .cat-card {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 11px 12px;
      border-radius: var(--radius-card);
      background: radial-gradient(circle at top left, #241245 0, #170b32 58%, #0a041a 100%);
      border: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
      transition: transform 0.14s ease-out, box-shadow 0.14s ease-out,
        border-color 0.14s ease-out, background 0.14s ease-out;
      min-height: 76px;
    }

    .cat-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: var(--radius-card);
      border: 1px solid transparent;
      background: linear-gradient(120deg, rgba(60, 211, 196, 0.22), rgba(181, 128, 255, 0.0));
      opacity: 0;
      transition: opacity 0.16s ease-out;
      pointer-events: none;
    }

    .cat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.7);
      border-color: rgba(123, 233, 220, 0.45);
      background: radial-gradient(circle at top left, #2d175a 0, #1a0e39 55%, #080317 100%);
    }

    .cat-card:hover::before {
      opacity: 1;
    }

    .cat-card:active {
      transform: translateY(0);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.6);
    }

    .cat-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-icon);
      background: radial-gradient(circle at 30% 20%, #f6fffd 0, #cffff8 30%, #2c7370 100%);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }

    .cat-icon span {
      font-size: 1.5rem;
    }

    .cat-content {
      flex: 1;
      min-width: 0;
    }

    .cat-title-main {
      font-size: 0.96rem;
      font-weight: 600;
      margin-bottom: 2px;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cat-title-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cat-title-extra {
      font-size: 0.78rem;
      color: var(--text-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cat-tag {
      font-size: 0.7rem;
      color: var(--mint-soft);
      margin-top: 3px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .cat-card.other {
      border-style: dashed;
      border-color: rgba(123, 233, 220, 0.5);
      background: radial-gradient(circle at top left, #26164d 0, #100723 60%, #050013 100%);
    }

    .cat-card.other .cat-icon {
      background: radial-gradient(circle at 30% 20%, #fdf9ff 0, #ffe2ff 26%, #5d2a73 96%);
    }

    .tm-footer-note {
      margin-top: 16px;
      font-size: 0.78rem;
      color: var(--text-soft);
    }

    .tm-footer-note strong {
      color: var(--mint-soft);
    }

    .tm-footer-note span {
      color: var(--accent-strong);
    }

    @media (max-width: 480px) {
      .tm-header {
        flex-wrap: wrap;
        row-gap: 8px;
      }
      .tm-lang-toggle {
        width: 100%;
        justify-content: flex-end;
      }
      .tm-hero-title {
        font-size: 1.28rem;
      }
    }

    @media (min-width: 880px) {
      .tm-hero-row {
        display: flex;
        align-items: flex-end;
        gap: 16px;
      }
      .tm-hero-text {
        flex: 1;
      }
    }
  </style>

    function renderCategories() {
      const t = TEXT[currentLang];
      els.grid.innerHTML = "";
      CATEGORIES.forEach((cat) => {
        const data = cat[currentLang];
        const card = document.createElement("a");
        card.href = "service-register-kyb-tranmarket.html";
        card.target = "_blank";
        card.className = "cat-card" + (cat.other ? " other" : "");
        card.setAttribute("data-key", cat.key);

        const icon = document.createElement("div");
        icon.className = "cat-icon";
        const iconSpan = document.createElement("span");
        iconSpan.textContent = cat.icon;
        icon.appendChild(iconSpan);

        const content = document.createElement("div");
        content.className = "cat-content";

        const titleMain = document.createElement("div");
        titleMain.className = "cat-title-main";
        titleMain.textContent = data.main;

        const titleSub = document.createElement("div");
        titleSub.className = "cat-title-sub";
        titleSub.textContent = data.sub;

        const titleExtra = document.createElement("div");
        titleExtra.className = "cat-title-extra";
        if (currentLang === "vi") {
          titleExtra.textContent = "";
        } else if (currentLang === "en") {
          titleExtra.textContent = "";
        } else if (currentLang === "cs") {
          titleExtra.textContent = "";
        }

        const tag = document.createElement("div");
        tag.className = "cat-tag";
        tag.textContent = cat.other ? t.tagOther : t.tagMain;

        content.appendChild(titleMain);
        content.appendChild(titleSub);
        if (titleExtra.textContent) content.appendChild(titleExtra);
        content.appendChild(tag);

        card.appendChild(icon);
        card.appendChild(content);

        els.grid.appendChild(card);
      });
    }

    function applyLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll(".tm-lang-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });
      renderText();
      renderCategories();
    }

    document.querySelectorAll(".tm-lang-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        applyLanguage(btn.dataset.lang);
      });
    });

    applyLanguage("vi");
  </script>
</body>
</html>
