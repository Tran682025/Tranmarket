    :root {
      --bg-body: #05001a;
      --bg-panel: #130b33;
      --bg-card: #1b123f;
      --accent: #b580ff;
      --accent-strong: #e1b8ff;
      --mint: #3cd3c4;
      --text-main: #ffffff;
      --text-soft: #9792d6;
      --text-muted: #c5c2f3;
      --border-soft: #332a70;
      --shadow-soft: 0 24px 48px rgba(0, 0, 0, 0.65);
      --radius-card: 18px;
      --radius-icon: 10px;
      --font-main: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-main);
      background: radial-gradient(
        circle at top left,
        #2f1e6a 0,
        #05001a 55%,
        #000000 100%
      );
      color: var(--text-main);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 10px 40px;
    }

    .page-wrapper {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
    }

    .tm-shell {
      background: linear-gradient(145deg, #1b123f 0, #0c0825 55%, #06041a 100%);
      border-radius: 28px;
      box-shadow: var(--shadow-soft);
      padding: 20px 20px 26px;
      border: 1px solid rgba(181, 128, 255, 0.32);
    }

    .tm-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .tm-logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tm-logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #ffe8b5, #c77c38 55%, #5a2a0b);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .tm-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .tm-brand-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .tm-brand-name {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .tm-brand-sub {
      font-size: 0.8rem;
      color: var(--text-soft);
    }

    .tm-lang-toggle {
    display: flex;
    gap: 4px;
    flex-wrap: nowrap;
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
}
.tm-lang-toggle::-webkit-scrollbar {
    display: none;
}

.tm-lang-btn {
    border: 0;
    padding: 4px 10px;
    border-radius: 999px;
    background: transparent;
    color: var(--text-muted);
    font-size: 0.75rem;
    cursor: pointer;
    min-width: 42px;
}
.tm-lang-btn.active {
    background: var(--mint);
    color: #021517;
    font-weight: 600;
}

    .tm-hero-row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 14px;
    }

    .tm-hero-text {
      flex: 1;
    }

    .tm-hero-title {
      font-size: 1.36rem;
      font-weight: 800;
      margin: 2px 0 4px;
    }

    .tm-hero-sub {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .tm-hero-note {
      font-size: 0.8rem;
      color: var(--text-soft);
      margin-bottom: 6px;
    }

    .tm-footer-note {
      font-size: 0.78rem;
      color: var(--text-soft);
      margin-top: 8px;
    }

    .tm-categories {
      margin-top: 4px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .cat-card {
      display: flex;
      gap: 10px;
      padding: 12px 11px;
      border-radius: var(--radius-card);
      background: radial-gradient(circle at top left, #24165a 0, #140a3b 48%, #0a0629 100%);
      border: 1px solid rgba(181, 128, 255, 0.45);
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
      transition: transform 0.14s ease-out, box-shadow 0.14s ease-out,
        border-color 0.14s ease-out, background 0.14s ease-out;
    }

    .cat-card.other {
      border-style: dashed;
      border-color: rgba(60, 211, 196, 0.75);
    }

    .cat-card::before {
      content: "";
      position: absolute;
      inset: -40%;
      background: radial-gradient(
        circle at top right,
        rgba(181, 128, 255, 0.22),
        transparent 55%
      );
      opacity: 0;
      transition: opacity 0.18s ease-out;
      pointer-events: none;
    }

    .cat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.9);
      border-color: rgba(181, 128, 255, 0.85);
      background: radial-gradient(circle at top left, #2a1f70 0, #150b40 48%, #070323 100%);
    }

    .cat-card:hover::before {
      opacity: 1;
    }

    .cat-icon {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      border-radius: var(--radius-icon);
      background: radial-gradient(circle at 30% 20%, #fef3d7, #f3b16a 55%, #8a4e1d);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .cat-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .cat-title-main {
      font-size: 0.9rem;
      font-weight: 700;
    }

    .cat-title-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .cat-title-extra {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-top: 4px;
      color: var(--mint);
      font-weight: 600;
    }

    .cat-tag {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      margin-top: 5px;
      color: var(--accent-strong);
    }

    @media (max-width: 960px) {
      .category-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .tm-hero-row {
        flex-direction: column;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 12px 6px 24px;
      }

      .tm-shell {
        padding: 14px 12px 20px;
        border-radius: 18px;
      }

      .category-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .tm-hero-title {
        font-size: 1.18rem;
      }
    }
  </style>
</head>

      brandSub: document.getElementById("brand-sub"),
      heroTitle: document.getElementById("hero-title"),
      heroSub: document.getElementById("hero-sub"),
      heroNote: document.getElementById("hero-note"),
      footerNote: document.getElementById("footer-note"),
      grid: document.getElementById("category-grid"),
    };

    const langButtons = document.querySelectorAll(".tm-lang-btn");

    function applyLanguage(lang) {
      currentLang = lang;
      const t = TEXT[lang];

      els.brandSub.textContent = t.brandSub;
      els.heroTitle.textContent = t.heroTitle;
      els.heroSub.textContent = t.heroSub;
      els.heroNote.textContent = t.heroNote;
      els.footerNote.textContent = t.footer;

      langButtons.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });

      renderCategories();
    }

    function renderCategories() {
      const t = TEXT[currentLang];
      els.grid.innerHTML = "";

      CATEGORIES.forEach((cat) => {
        const data = cat[currentLang];

        const card = document.createElement("a");
        card.href = cat.href || "#";
        card.target = "_blank";
        card.className = "cat-card" + (cat.other ? " other" : "");
        card.setAttribute("data-key", cat.key);

        const icon = document.createElement("div");
        icon.className = "cat-icon";
        const iconSpan = document.createElement("span");
        iconSpan.textContent = cat.icon;
        icon.appendChild(iconSpan);

        const content = document.createElement("div");
        content.className = "cat-content";

        const titleMain = document.createElement("div");
        titleMain.className = "cat-title-main";
        titleMain.textContent = data.main;

        const titleSub = document.createElement("div");
        titleSub.className = "cat-title-sub";
        titleSub.textContent = data.sub;

        const titleExtra = document.createElement("div");
        titleExtra.className = "cat-title-extra";
        if (currentLang === "vi") {
          titleExtra.textContent = "";
        } else if (currentLang === "en") {
          titleExtra.textContent = "";
        } else if (currentLang === "cs") {
          titleExtra.textContent = "";
        }

        const tag = document.createElement("div");
        tag.className = "cat-tag";
        tag.textContent = cat.other ? t.tagOther : t.tagMain;

        content.appendChild(titleMain);
        content.appendChild(titleSub);
        if (titleExtra.textContent) content.appendChild(titleExtra);
        content.appendChild(tag);

        card.appendChild(icon);
        card.appendChild(content);

        els.grid.appendChild(card);
      });
    }

    langButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const lang = btn.dataset.lang;
        if (lang && lang !== currentLang) {
          applyLanguage(lang);
        }
      });
    });

    applyLanguage("vi");
  </script>
</body>
</html>
