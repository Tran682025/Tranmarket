<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Tranmarket – Danh sách doanh nghiệp Pi-ready</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --tm-bg: #050310;
      --tm-panel: #120c28;
      --tm-border: #2a1f52;
      --tm-accent: #a855f7;
      --tm-accent-soft: rgba(168, 85, 247, 0.12);
      --tm-text: #f9fafb;
    
      --tm-muted: #9ca3af;
      --tm-badge-basic: #4ade80;
      --tm-badge-standard: #38bdf8;
      --tm-badge-full: #facc15;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e163d 0, #050310 45%, #000 100%);
      color: var(--tm-text);
      min-height: 100vh;
    }
    .tm-shell {
      max-width: 1120px;
      margin: 0 auto;
      padding: 1.25rem 1rem 2.5rem;
    }
    .tm-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .tm-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .tm-logo-small {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      object-fit: cover;
      border: 1px solid rgba(250, 250, 250, 0.4);
      box-shadow: 0 0 0 1px rgba(168, 85, 247, 0.5);
    }
    .tm-brand-name {
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 0.85rem;
      text-transform: uppercase;
    }
    .tm-brand-sub {
      font-size: 0.75rem;
      color: var(--tm-muted);
    }
    .tm-lang-pill {
      .tm-lang-btn {
  background: transparent;
  border: none;
  padding: 0 0.4rem;
  font: inherit;
  color: inherit;
  cursor: pointer;
  transition: 0.25s ease;
}
.tm-lang-btn:hover {
  opacity: 0.65;
}
.tm-lang-btn.active {
  font-weight: 700;
  text-decoration: underline;
}

      display: inline-flex;
      align-items: center;
      padding: 0.12rem 0.4rem;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      font-size: 0.7rem;
      text-transform: uppercase;
      gap: 0.15rem;
      color: var(--tm-muted);
    }
    .tm-lang-pill span:first-child {
      font-weight: 600;
      color: var(--tm-text);
    }
    .tm-panel {
      background: linear-gradient(135deg, #0b0718, #120c28);
      border-radius: 1rem;
      border: 1px solid var(--tm-border);
      padding: 1.25rem 1rem;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }
    .tm-panel-header {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .tm-title {
      font-size: 1.05rem;
      font-weight: 600;
    }
    .tm-subtitle {
      font-size: 0.8rem;
      color: var(--tm-muted);
      max-width: 420px;
    }
    .tm-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .tm-select,
    .tm-input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.6);
      color: var(--tm-text);
      border-radius: 999px;
      padding: 0.35rem 0.8rem;
      font-size: 0.8rem;
      min-width: 160px;
      outline: none;
    }
    .tm-input::placeholder { color: var(--tm-muted); }
    .tm-select:focus,
    .tm-input:focus {
      border-color: var(--tm-accent);
      box-shadow: 0 0 0 1px rgba(168, 85, 247, 0.4);
    }
    .tm-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 0.85rem;
    }
    .tm-card {
      background: radial-gradient(circle at top left, #1f153b, #070515 55%);
      border-radius: 0.9rem;
      border: 1px solid rgba(55, 65, 81, 0.9);
      padding: 0.8rem 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      position: relative;
      overflow: hidden;
    }
    .tm-card::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      background: conic-gradient(
        from 210deg,
        rgba(168, 85, 247, 0.55),
        transparent 22%,
        transparent 60%,
        rgba(96, 165, 250, 0.55),
        transparent 82%,
        transparent
      );
      opacity: 0;
      transition: opacity 150ms ease-out;
      z-index: 0;
    }
    .tm-card:hover::before { opacity: 0.22; }
    .tm-card-main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .tm-card-headline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .tm-company-name {
      font-size: 0.95rem;
      font-weight: 600;
    }
    .tm-badge-pi {
      font-size: 0.7rem;
      border-radius: 999px;
      padding: 0.12rem 0.55rem;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      background: var(--tm-accent-soft);
      border: 1px solid rgba(168, 85, 247, 0.9);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .tm-badge-pi[data-level="Basic"] {
      border-color: var(--tm-badge-basic);
      color: var(--tm-badge-basic);
      background: rgba(74, 222, 128, 0.08);
    }
    .tm-badge-pi[data-level="Standard"] {
      border-color: var(--tm-badge-standard);
      color: var(--tm-badge-standard);
      background: rgba(56, 189, 248, 0.08);
    }
    .tm-badge-pi[data-level="Full"] {
      border-color: var(--tm-badge-full);
      color: var(--tm-badge-full);
      background: rgba(250, 204, 21, 0.08);
    }
    .tm-badge-pi span:first-child {
      font-size: 0.8rem;
    }
    .tm-meta-line {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.75rem;
      font-size: 0.78rem;
      color: var(--tm-muted);
    }
    .tm-meta-line span {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      white-space: nowrap;
    }
    .tm-dot {
      width: 4px;
      height: 4px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.9);
    }
    .tm-description {
      font-size: 0.78rem;
      color: #e5e7eb;
      line-height: 1.4;
    }
    .tm-footer-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.35rem;
      font-size: 0.75rem;
    }
    .tm-contact {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem 0.6rem;
      color: var(--tm-muted);
    }
    .tm-contact span {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
    }
    .tm-card-actions {
      display: flex;
      gap: 0.4rem;
    }
    .tm-btn {
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      background: rgba(15, 23, 42, 0.7);
      padding: 0.25rem 0.7rem;
      font-size: 0.75rem;
      cursor: pointer;
      color: var(--tm-text);
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      text-decoration: none;
    }
    .tm-btn-primary {
      border-color: var(--tm-accent);
      background: linear-gradient(
        135deg,
        rgba(168, 85, 247, 0.15),
        rgba(56, 189, 248, 0.08)
      );
    }
    .tm-btn:hover { filter: brightness(1.05); }
    .tm-empty {
      font-size: 0.8rem;
      color: var(--tm-muted);
      padding: 0.6rem 0.2rem;
    }
    .tm-counter {
      font-size: 0.78rem;
      color: var(--tm-muted);
    }
    @media (max-width: 640px) {
      .tm-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .tm-panel-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .tm-footer-line {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.35rem;
      }
    }
  </style>
</head>
<body>
  <div class="tm-shell">
    <header class="tm-header">
      <div class="tm-brand">
        <img src="../assets/trm-logo-nav.png" alt="Tranmarket logo" class="tm-logo-small" />
        <div>
          <div class="tm-brand-name">TRANMARKET</div>
          <div class="tm-brand-sub">Pi-ready service marketplace directory</div>
        </div>
      </div>
    <div class="tm-lang-pill">
  <button class="tm-lang-btn" data-lang="vi">VI</button>
  <button class="tm-lang-btn" data-lang="en">EN</button>
  <button class="tm-lang-btn" data-lang="cz">CZ</button>
</div>

    </header>

    <section class="tm-panel">
      <div class="tm-panel-header">
        <div>
          <div class="tm-title">Danh sách doanh nghiệp đã đăng ký</div>
          <div class="tm-subtitle">
            Các đơn vị dưới đây đã gửi form KYB cho Tranmarket và được kiểm tra thủ công. Badge Pi cho biết mức độ sẵn sàng nhận thanh toán bằng Pi.
          </div>
        </div>
        <div class="tm-counter" id="tm-summary"></div>
      </div>

      <div class="tm-filters">
        <select id="filter-category" class="tm-select">
          <option value="">Tất cả danh mục</option>
        </select>
        <select id="filter-pi" class="tm-select">
          <option value="">Tất cả mức Pi-ready</option>
          <option value="Basic">Pi-ready (Basic)</option>
          <option value="Standard">Pi-ready (Standard)</option>
          <option value="Full">Pi-ready (Full)</option>
          <option value="PiOnly">Chỉ hiển thị nơi nhận Pi</option>
        </select>
        <input
          id="filter-search"
          class="tm-input"
          type="text"
          placeholder="Tìm theo tên, khu vực, người phụ trách..."
        />
      </div>

      <div id="providers-grid" class="tm-grid"></div>
      <div id="providers-empty" class="tm-empty" style="display:none;">
        Chưa có doanh nghiệp nào phù hợp với bộ lọc hiện tại.
      </div>
    </section>
  </div>

  <script>
    let currentLang = "vi";
let DIR_TEXT = {};

async function loadDirText() {
  const res = await fetch("./directory-text.json");
  DIR_TEXT = await res.json();
  applyDirectoryLang();
}

function applyDirectoryLang() {
  const t = DIR_TEXT[currentLang];
  document.getElementById("dir-title").textContent = t.title;
  document.getElementById("dir-subtitle").textContent = t.subtitle;
  document.getElementById("filter-all").textContent = t.all;
  document.getElementById("filter-pi").textContent = t.piReady;
  document.getElementById("search-box").placeholder = t.search;
}

    var state = {
      allProviders: [],
      filtered: []
    };

    var els = {
      grid: document.getElementById("providers-grid"),
      empty: document.getElementById("providers-empty"),
      category: document.getElementById("filter-category"),
      pi: document.getElementById("filter-pi"),
      search: document.getElementById("filter-search"),
      summary: document.getElementById("tm-summary")
    };

    function normalizeText(str) {
      return (str || "")
        .toString()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function buildMailTo(provider) {
      var subject = encodeURIComponent("[Tranmarket] Yêu cầu dịch vụ");
      var bodyLines = [
        "Xin chào " + (provider.company || ""),
        "",
        "Tôi muốn liên hệ sử dụng dịch vụ của quý đơn vị thông qua Tranmarket.",
        "",
        "- Dịch vụ: " + (provider.category || ""),
        "- Khu vực: " + (provider.area || ""),
        "",
        "Vui lòng phản hồi lại giúp tôi qua email này hoặc số điện thoại tôi cung cấp.",
        "",
        "Trân trọng,",
        ""
      ];
      var body = encodeURIComponent(bodyLines.join("\n"));
      var email = provider.email || "";
      if (!email) return "#";
      return "mailto:" + email + "?subject=" + subject + "&body=" + body;
    }

    function renderProviders() {
      var items = state.filtered;
      els.grid.innerHTML = "";

      if (!items.length) {
        els.empty.style.display = "block";
        els.summary.textContent = "0 doanh nghiệp khớp với bộ lọc.";
        return;
      }

      els.empty.style.display = "none";

      var total = state.allProviders.length;
      var piCount = state.allProviders.filter(function(p) { return p.piAccept; }).length;
      els.summary.textContent =
        items.length + " / " + total + " doanh nghiệp hiển thị – " +
        piCount + " đơn vị nhận thanh toán Pi.";

      var frag = document.createDocumentFragment();

      items.forEach(function(p) {
        var card = document.createElement("article");
        card.className = "tm-card";

        var main = document.createElement("div");
        main.className = "tm-card-main";

        var headline = document.createElement("div");
        headline.className = "tm-card-headline";

        var nameEl = document.createElement("div");
        nameEl.className = "tm-company-name";
        nameEl.textContent = p.company || "Chưa đặt tên";

        headline.appendChild(nameEl);

        if (p.piAccept) {
          var badge = document.createElement("div");
          badge.className = "tm-badge-pi";
          badge.setAttribute("data-level", p.piLevel || "Basic");

          var label = "Pi-ready";
          if (p.piLevel === "Standard") label = "Pi-ready+";
          if (p.piLevel === "Full") label = "Pi-Full";

          var iconSpan = document.createElement("span");
          iconSpan.textContent = "π";

          var textSpan = document.createElement("span");
          textSpan.textContent = label;

          badge.appendChild(iconSpan);
          badge.appendChild(textSpan);
          headline.appendChild(badge);
        }

        main.appendChild(headline);

        var metaLine = document.createElement("div");
        metaLine.className = "tm-meta-line";

        var catSpan = document.createElement("span");
        catSpan.innerHTML = '<span class="tm-dot"></span>' + (p.category || "");

        var areaSpan = document.createElement("span");
        areaSpan.innerHTML =
          '<span class="tm-dot"></span>' + (p.area || "Khu vực không rõ");

        metaLine.appendChild(catSpan);
        metaLine.appendChild(areaSpan);
        main.appendChild(metaLine);

        if (p.description) {
          var descEl = document.createElement("div");
          descEl.className = "tm-description";
          descEl.textContent = p.description;
          main.appendChild(descEl);
        }

        var footer = document.createElement("div");
        footer.className = "tm-footer-line";

        var contact = document.createElement("div");
        contact.className = "tm-contact";

        if (p.contact) {
          var c = document.createElement("span");
          c.textContent = p.contact;
          contact.appendChild(c);
        }
        if (p.phone) {
          var ph = document.createElement("span");
          ph.textContent = p.phone;
          contact.appendChild(ph);
        }
        if (p.email) {
          var em = document.createElement("span");
          em.textContent = p.email;
          contact.appendChild(em);
        }

        footer.appendChild(contact);

        var actions = document.createElement("div");
        actions.className = "tm-card-actions";

        if (p.email) {
          var btnMail = document.createElement("a");
          btnMail.href = buildMailTo(p);
          btnMail.className = "tm-btn tm-btn-primary";
          btnMail.textContent = "Gửi yêu cầu";
          actions.appendChild(btnMail);
        }

        if (p.website) {
          var btnWeb = document.createElement("a");
          btnWeb.href = p.website;
          btnWeb.target = "_blank";
          btnWeb.rel = "noopener noreferrer";
          btnWeb.className = "tm-btn";
          btnWeb.textContent = "Website";
          actions.appendChild(btnWeb);
        }

        footer.appendChild(actions);
        main.appendChild(footer);

        card.appendChild(main);
        frag.appendChild(card);
      });

      els.grid.appendChild(frag);
    }

    function applyFilters() {
      var catValue = els.category.value || "";
      var piValue = els.pi.value || "";
      var searchValue = normalizeText(els.search.value);

      var list = state.allProviders.slice();

      if (catValue) {
        list = list.filter(function(p) { return p.category === catValue; });
      }

      if (piValue) {
        if (piValue === "PiOnly") {
          list = list.filter(function(p) { return p.piAccept; });
        } else {
          list = list.filter(function(p) {
            var level = p.piLevel || "Basic";
            return p.piAccept && level === piValue;
          });
        }
      }

      if (searchValue) {
        list = list.filter(function(p) {
          var haystack = [
            p.company,
            p.category,
            p.area,
            p.contact,
            p.description
          ].map(normalizeText).join(" ");
          return haystack.indexOf(searchValue) !== -1;
        });
      }

      state.filtered = list;
      renderProviders();
    }

    function populateCategoryFilter() {
      var cats = [];
      state.allProviders.forEach(function(p) {
        if (p.category && cats.indexOf(p.category) === -1) {
          cats.push(p.category);
        }
      });
      cats.sort(function(a, b) { return a.localeCompare(b, "cs"); });

      els.category.innerHTML = '<option value="">Tất cả danh mục</option>';
      cats.forEach(function(c) {
        var opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        els.category.appendChild(opt);
      });
    }

    function initFilters() {
      els.category.addEventListener("change", applyFilters);
      els.pi.addEventListener("change", applyFilters);
      els.search.addEventListener("input", applyFilters);
    }

   function loadProviders() {
  fetch("./kyb-text.json", { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) throw new Error("Failed to load kyb-text.json");
      return res.json();
    })
    .then(function (data) {
      if (Object.prototype.toString.call(data) !== "[object Array]") {
        state.allProviders = [];
      } else {
        state.allProviders = data;
      }
      state.filtered = state.allProviders.slice();
      populateCategoryFilter();
      renderProviders();
    })
    .catch(function (err) {
      console.error(err);
      els.empty.style.display = "block";
      els.empty.textContent = "Không tải được danh sách doanh nghiệp. Vui lòng thử lại sau.";
    });
}

document.querySelectorAll(".tm-lang-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    currentLang = btn.dataset.lang;
    applyDirectoryLang();
    buildDirectory(); // reload data UI nếu đang filter
  });
});

loadDirText();

    initFilters();
    loadProviders();
  </script>
</body>
</html>
