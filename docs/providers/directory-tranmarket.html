<html lang="vi">
<head>

  <title>Tranmarket – Danh sách doanh nghiệp Pi-ready</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {

      --tm-border: #2a1f52;

      --tm-muted: #9ca3af;
      --tm-badge-basic: #4ade80;.tm-lang-btn {
  background: transparent;
  border: none;
  padding: 0 0.4rem;
  font: inherit;
  color: inherit;
  cursor: pointer;
  transition: 0.25s ease;
}
.tm-lang-btn:hover {

}
.tm-lang-btn.active {
  font-weight: 700;
  text-decoration: underline;
}

      --tm-badge-standard: #38bdf8;
      --tm-badge-full: #facc15;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e163d 0, #050310 45%, #000 100%);
      color: var(--tm-text);
      min-height: 100vh;
    }

      max-width: 1120px;

    }

    }
<header class="tm-header">

    <img src="../assets/trm-logo-nav.png" alt="Tranmarket logo" class="tm-logo-small" />

      <div class="tm-brand-name">TRANMARKET</div>

  <div class="tm-lang-pill">
    <button class="tm-lang-btn active" data-lang="vi">VI</button>
    <span>/</span>

      display: inline-flex;
      align-items: center;
      padding: 0.12rem 0.4rem;

      border: 1px solid rgba(148, 163, 184, 0.5);

      font-weight: 600;

    .tm-panel {
      background: linear-gradient(135deg, #0b0718, #120c28);
      border-radius: 1rem;
      border: 1px solid var(--tm-border);

    .tm-panel-header {
      display: flex;
      flex-wrap: wrap;

    .tm-subtitle {
      font-size: 0.8rem;

    }
    .tm-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;

    .tm-select,
    .tm-input {
      background: rgba(15, 23, 42, 0.6);

      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));

    .tm-card {
      background: radial-gradient(circle at top left, #1f153b, #070515 55%);

      border: 1px solid rgba(55, 65, 81, 0.9);
      padding: 0.8rem 0.9rem;

      inset: -1px;

        transparent 60%,
        rgba(96, 165, 250, 0.55),
        transparent 82%,
        transparent
      );
      opacity: 0;
      transition: opacity 150ms ease-out;
      z-index: 0;
    }
    .tm-card:hover::before { opacity: 0.22; }
    .tm-card-main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;

    }

      border-radius: 999px;

      border-color: var(--tm-badge-basic);

    .tm-badge-pi[data-level="Standard"] {
      border-color: var(--tm-badge-standard);
      color: var(--tm-badge-standard);
      background: rgba(56, 189, 248, 0.08);
    }
    .tm-badge-pi[data-level="Full"] {
      border-color: var(--tm-badge-full);

      background: rgba(250, 204, 21, 0.08);
    }
    .tm-badge-pi span:first-child {
      font-size: 0.8rem;
    }
    .tm-meta-line {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.75rem;
      font-size: 0.78rem;
      color: var(--tm-muted);
    }
    .tm-meta-line span {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      white-space: nowrap;
    }
    .tm-dot {
      width: 4px;
      height: 4px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.9);
    }
    .tm-description {
      font-size: 0.78rem;
      color: #e5e7eb;
      line-height: 1.4;
    }
    .tm-footer-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.35rem;
      font-size: 0.75rem;
    }
    .tm-contact {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem 0.6rem;

    }
    .tm-contact span {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
    }
    .tm-card-actions {
      display: flex;
      gap: 0.4rem;
    }
    .tm-btn {
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      background: rgba(15, 23, 42, 0.7);
      padding: 0.25rem 0.7rem;
      font-size: 0.75rem;
      cursor: pointer;
      color: var(--tm-text);
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      text-decoration: none;
    }
    .tm-btn-primary {
      border-color: var(--tm-accent);
      background: linear-gradient(
        135deg,
        rgba(168, 85, 247, 0.15),
        rgba(56, 189, 248, 0.08)
      );
    }
    .tm-btn:hover { filter: brightness(1.05); }
    .tm-empty {
      font-size: 0.8rem;
      color: var(--tm-muted);

    }
    .tm-counter {
      font-size: 0.78rem;

    }
    @media (max-width: 640px) {
      .tm-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .tm-panel-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .tm-footer-line {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.35rem;
      }
    }
  </style>
</head>
<body>
  <div class="tm-shell">
    <header class="tm-header">
      <div class="tm-brand">
        <img src="../assets/trm-logo-nav.png" alt="Tranmarket logo" class="tm-logo-small" />
        <div>
          <div class="tm-brand-name">TRANMARKET</div>
          <div class="tm-brand-sub">Pi-ready service marketplace directory</div>
        </div>
      </div>
    <div class="tm-lang-pill">
  <button class="tm-lang-btn" data-lang="vi">VI</button>
  <button class="tm-lang-btn" data-lang="en">EN</button>
  <button class="tm-lang-btn" data-lang="cz">CZ</button>
</div>

    </header>
<section class="tm-panel">
  <div class="tm-panel-header">
    <div class="tm-title" id="dsr-title">
      Danh sách doanh nghiệp đã đăng ký
    </div>
    <div class="tm-subtitle" id="dsr-subtitle">
      Các đơn vị dưới đây đã gửi form KYB cho Tranmarket và được kiểm tra thủ công. Badge Pi cho biết mức độ sẵn sàng nhận thanh toán bằng Pi.
    </div>
    <div class="tm-counter" id="tm-summary"></div>
  </div>

  <div class="tm-filters">
    <select id="filter-category" class="tm-select">
      <option value="all" id="filter-all">Tất cả danh mục</option>
      <!-- các option khác giữ nguyên -->
    </select>

    <select id="filter-pi" class="tm-select">
      <option value="all" id="filter-pi">Tất cả mức Pi-ready</option>
      <option value="Basic">Basic – Pi-ready (Basic)</option>
      <option value="Standard">Standard – Pi-ready (Standard)</option>
      <option value="Full">Full – Pi-ready (Full)</option>
      <option value="PiOnly">PiOnly – Chỉ nhận thanh toán Pi</option>
    </select>

    <input
      id="filter-search"
      type="text"
      placeholder="Tìm theo tên, khu vực, ngành nghề..."
    />
  </div>
</section>

  
  </div>

  <script>
// =========================
// CONFIG
// =========================
const DIR_LANG_URL = "./directory-text.json";  // text đa ngôn ngữ
const PROVIDERS_URL = "./kyb-text.json";       // danh sách doanh nghiệp

// =========================
// STATE
// =========================
const state = {
  lang: {},
  currentLang: "vi",
  providers: [],
  filtered: []
};

// =========================
// ELEMENTS
// =========================
const els = {
  title: document.getElementById("dsr-title"),
  subtitle: document.getElementById("dsr-subtitle"),
  filterAll: document.getElementById("filter-all"),
  filterPiSelect: document.getElementById("filter-pi"),
  search: document.getElementById("filter-search"),
  grid: document.getElementById("providers-grid"),
  empty: document.getElementById("providers-empty"),
  summary: document.getElementById("tm-summary"),
  categorySelect: document.getElementById("filter-category"),
  langButtons: document.querySelectorAll(".tm-lang-btn")
};

// =========================
// HELPERS
// =========================
function escapeHtml(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function badgeHtml(provider) {
  if (!provider.piAccept) return "";
  const level = (provider.piLevel || "").trim();

  let cls = "tm-badge";
  if (level === "Basic") cls += " tm-badge-basic";
  else if (level === "Standard") cls += " tm-badge-standard";
  else if (level === "Full") cls += " tm-badge-full";
  else if (level === "PiOnly") cls += " tm-badge-pi-only";

  const label =
    level === "PiOnly"
      ? "PI-ONLY"
      : level
      ? "PI-READY"
      : "PI";

  return `<span class="${cls}">${label}</span>`;
}

function buildCardHtml(p) {
  const badge = badgeHtml(p);

  return `
    <article class="tm-card" data-id="${escapeHtml(p.id)}">
      <div class="tm-card-main">
        <div class="tm-card-header">
          <div class="tm-card-name">${escapeHtml(p.company)}</div>
          ${badge}
        </div>

        <div class="tm-card-lines">
          <div class="tm-card-line">${escapeHtml(p.category)}</div>
          <div class="tm-card-line">${escapeHtml(p.area)}</div>
          <div class="tm-card-line">${escapeHtml(p.description || "")}</div>
        </div>
      </div>

      <div class="tm-card-footer">
        <div class="tm-card-contact">
          <div>${escapeHtml(p.contact || "")}</div>
          <div>${escapeHtml(p.phone || "")}</div>
          <div>${escapeHtml(p.email || "")}</div>
        </div>

        <div class="tm-card-actions">
          ${
            p.website
              ? `<a href="${p.website}" target="_blank" rel="noopener" class="tm-btn tm-btn-ghost">Website</a>`
              : ""
          }
          ${
            p.email
              ? `<a href="mailto:${p.email}" class="tm-btn tm-btn-primary">Gửi email</a>`
              : ""
          }
        </div>
      </div>
    </article>
  `;
}

// =========================
// LANGUAGE
// =========================
function applyLang() {
  const t =
    state.lang[state.currentLang] ||
    state.lang["vi"] ||
    null;

  if (!t) return;

  if (els.title) els.title.textContent = t.title;
  if (els.subtitle) els.subtitle.textContent = t.subtitle;
  if (els.filterAll) els.filterAll.textContent = t.all;

  if (els.filterPiSelect && els.filterPiSelect.options.length > 0) {
    els.filterPiSelect.options[0].textContent = t.piReady;
  }

  if (els.search) els.search.placeholder = t.search;
  if (els.empty) els.empty.textContent = t.nodata;
}

function loadDirectoryText() {
  return fetch(DIR_LANG_URL)
    .then((res) => {
      if (!res.ok) throw new Error("Failed to load directory-text.json");
      return res.json();
    })
    .then((data) => {
      state.lang = data || {};
      applyLang();
    })
    .catch((err) => {
      console.error(err);
    });
}

// =========================
// FILTER + RENDER
// =========================
function applyFilters() {
  const categoryValue = els.categorySelect
    ? els.categorySelect.value
    : "all";
  const piValue = els.filterPiSelect
    ? els.filterPiSelect.value
    : "all";
  const searchValue = els.search
    ? els.search.value.trim().toLowerCase()
    : "";

  state.filtered = state.providers.filter((p) => {
    // category
    if (categoryValue !== "all" && p.category !== categoryValue) {
      return false;
    }

    // pi-level
    if (piValue !== "all") {
      if (piValue === "PiOnly") {
        if (p.piLevel !== "PiOnly") return false;
      } else {
        if (p.piLevel !== piValue) return false;
      }
    }

    // search
    if (searchValue) {
      const haystack = (
        (p.company || "") +
        " " +
        (p.category || "") +
        " " +
        (p.area || "") +
        " " +
        (p.description || "")
      )
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
      const needle = searchValue
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

      if (!haystack.includes(needle)) return false;
    }

    return true;
  });

  renderProviders();
}

function renderProviders() {
  if (!els.grid || !els.empty) return;

  if (!state.filtered || state.filtered.length === 0) {
    els.grid.innerHTML = "";
    els.empty.style.display = "block";
    return;
  }

  els.empty.style.display = "none";

  const total = state.providers.length;
  const piCount = state.filtered.filter((p) => p.piAccept).length;

  if (els.summary) {
    els.summary.textContent =
      `${state.filtered.length} / ${total} doanh nghiệp hiển thị – ` +
      `${piCount} đơn vị nhận thanh toán Pi.`;
  }

  els.grid.innerHTML = state.filtered.map(buildCardHtml).join("");
}

// =========================
// LOAD PROVIDERS
// =========================
function loadProviders() {
  return fetch(PROVIDERS_URL, { cache: "no-store" })
    .then((res) => {
      if (!res.ok) throw new Error("Failed to load kyb-text.json");
      return res.json();
    })
    .then((data) => {
      if (!Array.isArray(data)) {
        state.providers = [];
      } else {
        state.providers = data;
      }
      state.filtered = state.providers.slice();
      renderProviders();
    })
    .catch((err) => {
      console.error(err);
      if (els.empty) {
        els.empty.style.display = "block";
        els.empty.textContent =
          "Không tải được danh sách doanh nghiệp. Vui lòng thử lại sau.";
      }
    });
}

// =========================
// INIT
// =========================
function initFilters() {
  if (els.categorySelect) {
    els.categorySelect.addEventListener("change", applyFilters);
  }
  if (els.filterPiSelect) {
    els.filterPiSelect.addEventListener("change", applyFilters);
  }
  if (els.search) {
    els.search.addEventListener("input", applyFilters);
  }

  if (els.langButtons && els.langButtons.length > 0) {
    els.langButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const lang = btn.dataset.lang;
        if (!lang || lang === state.currentLang) return;

        state.currentLang = lang;

        els.langButtons.forEach((b) => {
          b.classList.toggle("active", b === btn);
        });

        // chỉ đổi text, KHÔNG đụng tới danh sách doanh nghiệp
        applyLang();
      });
    });
  }
}

// chạy khi DOM sẵn sàng (file script đặt cuối body nên OK)
initFilters();
loadDirectoryText();
loadProviders();
</script>
