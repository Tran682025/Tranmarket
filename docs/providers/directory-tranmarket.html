  <div class="tm-shell">
    <header class="tm-header">
      <div class="tm-brand">
        <img src="../assets/trm-logo-nav.png" alt="Tranmarket logo" class="tm-logo-small" />

    <div class="tm-lang-pill">
  <button class="tm-lang-btn" data-lang="vi">VI</button>
  <button class="tm-lang-btn" data-lang="en">EN</button>
  <button class="tm-lang-btn" data-lang="cz">CZ</button>
</div>

    </header>
<section class="tm-panel">
  <div class="tm-panel-header">
    <div class="tm-title" id="dsr-title">
      Danh sách doanh nghiệp đã đăng ký
    </div>
    <div class="tm-subtitle" id="dsr-subtitle">
      Các đơn vị dưới đây đã gửi form KYB cho Tranmarket và được kiểm tra thủ công. Badge Pi cho biết mức độ sẵn sàng nhận thanh toán bằng Pi.
    </div>
    <div class="tm-counter" id="tm-summary"></div>
  </div>

  <div class="tm-filters">
    <select id="filter-category" class="tm-select">
      <option value="all" id="filter-all">Tất cả danh mục</option>
      <!-- các option khác giữ nguyên -->
    </select>

    <select id="filter-pi" class="tm-select">
      <option value="all" id="filter-pi">Tất cả mức Pi-ready</option>
      <option value="Basic">Basic – Pi-ready (Basic)</option>
      <option value="Standard">Standard – Pi-ready (Standard)</option>
      <option value="Full">Full – Pi-ready (Full)</option>
      <option value="PiOnly">PiOnly – Chỉ nhận thanh toán Pi</option>
    </select>

    <input
      id="filter-search"
      type="text"
      placeholder="Tìm theo tên, khu vực, ngành nghề..."
    />
  </div>
</section>

  
  </div>

<script>
// =======================
// Directory – data & state
// =======================
const DATA_URL = 'kyb-text.json'; // cùng thư mục với file HTML

let allProviders = [];
let currentLanguage = 'vi';

// chạy khi DOM sẵn sàng
document.addEventListener('DOMContentLoaded', () => {
  loadProviders();
  setupFilters();
  setupLangSwitch();
});

// nạp dữ liệu từ JSON
function loadProviders() {
  fetch(DATA_URL)
    .then(res => res.json())
    .then(data => {
      allProviders = data;          // giữ nguyên data gốc
      renderProviders(allProviders); // render lần đầu
    })
    .catch(err => {
      console.error('Error loading providers:', err);
    });
}

// vẽ danh sách provider
function renderProviders(list) {
  const container = document.getElementById('providers-list');
  if (!container) return;

  container.innerHTML = '';

  if (!list || list.length === 0) {
    container.innerHTML = `
      <p class="empty-state">
        No providers match your filters.
      </p>
    `;
    return;
  }

  list.forEach(p => {
    const card = document.createElement('div');
    card.className = 'provider-card';

    card.innerHTML = `
      <div class="provider-header">
        <h3>${p.company}</h3>
        ${p.piAccept ? `<span class="pi-badge">${p.piLevel || 'Pi-ready'}</span>` : ''}
      </div>
      <p class="provider-category">${p.category}</p>
      <p class="provider-area">${p.area}</p>
      <p class="provider-desc">${p.description}</p>
      <div class="provider-contact">
        <span>${p.contact}</span>
        ${p.phone ? `<span>☎ ${p.phone}</span>` : ''}
        ${p.email ? `<span>✉ ${p.email}</span>` : ''}
      </div>
    `;

    container.appendChild(card);
  });
}

// =======================
// Filters
// =======================
function setupFilters() {
  const catSelect = document.getElementById('filter-category');
  const piSelect  = document.getElementById('filter-pi');
  const searchInp = document.getElementById('filter-search');

  if (catSelect)  catSelect.addEventListener('change', applyFilters);
  if (piSelect)   piSelect.addEventListener('change', applyFilters);
  if (searchInp)  searchInp.addEventListener('input', applyFilters);
}

function applyFilters() {
  const catSelect = document.getElementById('filter-category');
  const piSelect  = document.getElementById('filter-pi');
  const searchInp = document.getElementById('filter-search');

  const catValue = catSelect ? catSelect.value : 'all';
  const piValue  = piSelect  ? piSelect.value  : 'all';
  const keyword  = searchInp ? searchInp.value.trim().toLowerCase() : '';

  const filtered = allProviders.filter(p => {
    // lọc theo category
    if (catValue && catValue !== 'all' && p.category !== catValue) return false;

    // lọc theo Pi-ready
    if (piValue && piValue !== 'all') {
      if (piValue === 'pi-ready' && !p.piAccept) return false;
      if (piValue === 'pi-full' && p.piLevel !== 'Full') return false;
    }

    // lọc theo từ khóa
    if (keyword) {
      const text = `${p.company} ${p.area} ${p.contact} ${p.description}`.toLowerCase();
      if (!text.includes(keyword)) return false;
    }

    return true;
  });

  renderProviders(filtered);
}

// =======================
// Language switch (chỉ đổi UI text, không đụng data)
// =======================
function setupLangSwitch() {
  const btnVI = document.getElementById('lang-vi');
  const btnEN = document.getElementById('lang-en');
  const btnCZ = document.getElementById('lang-cz');

  if (btnVI) btnVI.addEventListener('click', () => setLanguage('vi'));
  if (btnEN) btnEN.addEventListener('click', () => setLanguage('en'));
  if (btnCZ) btnCZ.addEventListener('click', () => setLanguage('cz'));
}

function setLanguage(lang) {
  currentLanguage = lang;

  // chỉ đổi text tĩnh trên trang (heading, description, label…)
  // KHÔNG đụng tới allProviders, KHÔNG fetch lại JSON
  // ví dụ:
  // document.getElementById('directory-title').textContent = ...
  // document.getElementById('directory-subtitle').textContent = ...

  // TODO: nối với hệ thống đa ngôn ngữ sẵn có của Tranmarket
}
</script>
