  />

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>
    // Khởi tạo Pi SDK – nếu đang mở trong Pi Browser
    if (typeof window.Pi !== "undefined") {
      window.Pi.init({
        version: "2.0",
        sandbox: false
      });
      console.log("[Index] Pi SDK initialized");
    } else {
      console.warn("[Index] Pi SDK NOT found. Hãy mở trong Pi Browser để test ví Pi.");

  <style>
    :root {
      --bg-main: #020018;
      --card-bg: rgba(8, 0, 40, 0.96);
      --card-soft: rgba(12, 0, 50, 0.92);
      --accent: #9f7bff;
      --accent-soft: rgba(159, 123, 255, 0.25);
      --accent-strong: #ffbb00;
      --text-main: #f5f6ff;
      --text-muted: #b7bce6;
      --radius-xl: 24px;
      --shadow-soft: 0 18px 45px rgba(0, 0, 0, 0.7);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      min-height: 100vh;
      background-color: var(--bg-main);
      background-image: url("assets/trm-logo-background.png");
      background-size: cover;
      background-position: center;
      color: var(--text-main);
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(
          circle at top,
          rgba(159, 123, 255, 0.22),
          transparent 55%
        ),
        radial-gradient(
          circle at bottom,
          rgba(255, 80, 170, 0.18),
          transparent 55%
        );
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1040px;
      padding: 32px 20px 40px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* Top bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 20%, #fff2, transparent 50%),
        #1b1029;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.8);
    }

    .brand-logo img {
      width: 120%;
      height: auto;
    }

    .brand-text-main {
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 14px;
      text-transform: uppercase;
    }

    .brand-text-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .lang-switch {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .lang-switch button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 999px;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .lang-switch button.active {
      background: var(--accent-soft);
      color: #ffffff;
      font-weight: 600;
    }

    #pi-login {
      font-size: 12px;
      color: var(--text-muted);
      min-width: 120px;
      text-align: right;
    }

    /* Hero */
    .hero {
      margin-top: 4px;
      padding: 22px 20px 20px;
      border-radius: var(--radius-xl);
      background: linear-gradient(
        135deg,
        rgba(7, 0, 40, 0.96),
        rgba(10, 0, 50, 0.98)
      );
      box-shadow: var(--shadow-soft);
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 2.2fr);
      gap: 24px;
      align-items: center;
    }

    .hero-main-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .hero-main-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .hero-main-desc {
      font-size: 14px;
      color: var(--text-main);
      opacity: 0.94;
      line-height: 1.5;
    }

    .hero-tagline {
      margin-top: 10px;
      font-size: 12px;
      color: var(--accent-strong);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hero-logo-wrap {
      text-align: center;
    }

    .hero-logo {
      width: 120px;
      height: 120px;
      margin: 4px auto 8px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 20%, #fff3, transparent 55%),
        #20142f;
      box-shadow: 0 0 32px rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .hero-logo img {
      width: 120%;
      height: auto;
    }

    .hero-note {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .hero-links {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .hero-link {
      font-size: 11px;
      color: var(--accent);
      text-decoration: underline;
      cursor: pointer;
    }

    /* Services grid */
    .section-header {
      margin-top: 8px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
    }

    .section-sub {
      font-size: 13px;
      color: var(--text-muted);
    }

    .services-grid {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .service-card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 10px 11px;
      border: 1px solid rgba(159, 123, 255, 0.42);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      transition: transform 0.12s ease, box-shadow 0.12s ease,
        border-color 0.12s ease, background 0.12s ease;
      color: inherit;
      text-decoration: none;
    }

    .service-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.8);
      border-color: var(--accent-strong);
      background: var(--card-soft);
    }

    .service-icon {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 20%, #fff2, transparent 52%),
        #24173a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .service-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .service-title {
      font-size: 13px;
      font-weight: 600;
    }

    .service-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.35;
    }

    /* Bottom row: CTAs */
    .cta-row {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn-primary,
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 18px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-primary {
      color: #ffffff;
      background: linear-gradient(90deg, #7a00ff, #ffbb00);
      box-shadow: 0 0 16px rgba(0, 0, 0, 0.7);
    }

    .btn-secondary {
      color: var(--text-main);
      background: rgba(22, 10, 60, 0.9);
      border: 1px solid rgba(159, 123, 255, 0.6);
    }

    .btn-primary span,
    .btn-secondary span {
      margin-left: 6px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.8;
    }

    footer {
      margin-top: 18px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: minmax(0, 1fr);
      }
      .services-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .page {
        padding-inline: 14px;
      }
      .hero {
        padding: 18px 14px 16px;
      }
      .brand-text-main {
        font-size: 13px;
      }
      .brand-text-sub {
        display: none;
      }
      .top-right {
        gap: 8px;
      }
      .services-grid {
        grid-template-columns: minmax(0, 1fr);
      }
      #pi-login {
        min-width: auto;
      }
    }
  </style>
</head>

    function switchLang(lang) {
      const pack = langPack[lang] || langPack.en;

      // Lưu ngôn ngữ
      try {
        localStorage.setItem(STORAGE_LANG_KEY, lang);
      } catch (e) {
        console.warn("[Tranmarket] Cannot save lang", e);
      }

      document.getElementById("brand-sub").innerText = pack.brandSub;

      document.getElementById("hero-title").innerText = pack.heroTitle;
      document.getElementById("hero-sub").innerText = pack.heroSub;
      document.getElementById("hero-desc").innerText = pack.heroDesc;
      document.getElementById("hero-tagline").innerText = pack.heroTagline;
      document.getElementById("hero-note").innerText = pack.heroNote;
      document.getElementById("hero-link-direct").innerText =
        pack.heroLinkDirect;
      document.getElementById("hero-link-kyb").innerText = pack.heroLinkKyb;

      document.getElementById("services-title").innerText =
        pack.servicesTitle;
      document.getElementById("services-sub").innerText = pack.servicesSub;

      document.getElementById("cta-direct-text").innerText =
        pack.ctaDirectText;
      document.getElementById("cta-kyb-text").innerText = pack.ctaKybText;

      document.getElementById("copyright").innerText = pack.copyright;

      // Cập nhật nội dung 18 danh mục
      const cats = pack.categories;
      Object.keys(cats).forEach(key => {
        document
          .querySelectorAll('[data-cat-title="' + key + '"]')
          .forEach(el => (el.innerText = cats[key].title));
        document
          .querySelectorAll('[data-cat-desc="' + key + '"]')
          .forEach(el => (el.innerText = cats[key].desc));
      });

      // Active state cho nút ngôn ngữ
      document
        .querySelectorAll(".lang-switch button")
        .forEach(btn => btn.classList.remove("active"));
      const activeBtn = document.getElementById("btn-" + lang);
      if (activeBtn) activeBtn.classList.add("active");

      // Lang attribute cho <html>
      document.documentElement.setAttribute("lang", lang === "vi" ? "vi" : lang);
    }

    function openCategory(catKey) {
      // Điều hướng sang Day 5 – Category B, kèm tham số cat
      window.location.href =
        "day5-category-b.html?cat=" + encodeURIComponent(catKey);
    }

    document.addEventListener("DOMContentLoaded", function () {
      // Ngôn ngữ mặc định (ưu tiên cái đã lưu)
      let initialLang = "en";
      try {
        const storedLang = localStorage.getItem(STORAGE_LANG_KEY);
        if (storedLang && langPack[storedLang]) {
          initialLang = storedLang;
        }
      } catch (e) {
        console.warn("[Tranmarket] Cannot read lang", e);
      }

      switchLang(initialLang);

      // Khởi tạo trạng thái Pi login (nếu helper đã load)
      if (typeof initPiLogin === "function") {
        initPiLogin(); // vẽ CONNECT PI WALLET hoặc @username · ví
      }
    });
  </script>
