<!-- 1) LOAD PI SDK TRƯỚC KHI DÙNG window.Pi -->
<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<script>
const langPack = {
  en: {
    headline: "Connect Wallet to Enter",
    sub: "(Kết nối ví để truy cập)",
    powered: "Powered by Pi Web3",
    button: "Connect Pi Wallet",
    copyright: "© 2025 Tranmarket Web3 Services — All rights reserved."
  },
  vi: {
    headline: "Kết nối ví để truy cập",
    sub: "(Connect Wallet to Enter)",
    powered: "Vận hành bởi Pi Web3",
    button: "Kết nối ví Pi",
    copyright: "© 2025 Tranmarket Web3 Services — Bảo lưu mọi quyền."
  },
  cz: {
    headline: "Připojte peněženku pro vstup",
    sub: "(Connect Wallet to Enter)",
    powered: "Poháněno technologií Pi Web3",
    button: "Připojit Pi peněženku",
    copyright: "© 2025 Tranmarket Web3 Services — Všechna práva vyhrazena."
  }
};

async function connectPiWallet() {
  // Nếu không phải Pi Browser
  if (!window.Pi) {
    alert("Không tìm thấy Pi SDK.\nHãy mở trang này bên trong Pi Browser để kết nối ví Pi.");
    return;
  }

  // KHỞI TẠO PI SDK (nhớ thay App ID sau)
  Pi.init({
    version: "2.0",
    appId: "THAY_APP_ID_TRANMARKET_VAO_DAY",  // <<< thay bằng App ID thật khi có
    sandbox: true
  });

  try {
    const scopes = ["username"]; // Phase 8 chỉ cần username

    const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);

    const username = auth?.user?.username || "";

    // Lưu username cho trang sau
    localStorage.setItem("trm_username", username);

    alert("🎉 Kết nối thành công — User: " + username);

    // PHASE 8 — chuyển sang menu chính
    window.location.href = "providers/service-categories.html?user=" + encodeURIComponent(username);

  } catch (err) {
    alert("Kết nối ví thất bại: " + (err?.message || "Lỗi không xác định"));
    console.error(err);
  }
}

function onIncompletePaymentFound(payment) {
  console.log("Incomplete Payment:", payment);
}

function switchLang(l) {
  window.trmCurrentLang = l;

  document.getElementById("headline").innerText    = langPack[l].headline;
  document.getElementById("sub").innerText         = langPack[l].sub;
  document.getElementById("powered").innerText     = langPack[l].powered;
  document.getElementById("btn-connect").innerText = langPack[l].button;
  document.getElementById("copyright").innerText   = langPack[l].copyright;

  document.querySelectorAll(".lang-switch button")
    .forEach(btn => btn.classList.remove("active"));
  document.getElementById("btn-" + l).classList.add("active");
}

// Ngôn ngữ mặc định khi load trang
switchLang("en");
</script>
