    :root {

    * {

    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at top, #211b3b, #050509);
      color: var(--text-main);
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: radial-gradient(circle at 20% 0%, #ffdd8c, #8a5b21);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .lang-switch {
      display: flex;
      gap: 8px;
      padding: 2px;
      border-radius: 999px;
      background: rgba(10, 7, 40, 0.94);
    }

    .lang-switch button {
      border: none;
      background: transparent;
      color: #c7cff5;
      padding: 6px 14px;
      font-size: 13px;
      border-radius: 999px;
      cursor: pointer;
    }

    .lang-switch button.active {
      background: linear-gradient(120deg, #9f7bff, #ffb000);
      color: #050314;
      font-weight: 600;
    }

    main {
      background:
        radial-gradient(circle at top left, rgba(159, 123, 255, 0.15), transparent 55%),
        radial-gradient(circle at top right, rgba(255, 176, 0, 0.12), transparent 55%);
      border-radius: 28px;
      padding: 24px 18px 28px;
      box-shadow: var(--shadow-soft);
    }

    .hero-text {
      margin-bottom: 20px;
    }

    h1#page-title {
      margin: 0 0 10px;
      font-size: 26px;
    }

    p#page-intro {
      margin: 0;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .services-grid {
      margin-top: 22px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .service-card-link {
      text-decoration: none;
      color: inherit;
    }

    .service-card {
      background: rgba(10, 6, 50, 0.96);
      border-radius: 18px;
      padding: 14px 14px 12px;
      border: 1px solid rgba(159, 123, 255, 0.24);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 110px;
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }

    .service-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.8);
      border-color: var(--accent-strong);
      background: rgba(12, 7, 60, 0.98);
    }

    .service-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .service-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .badge {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #ffcc7d;
    }

    .taxi-note {
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .taxi-note strong {
      color: #ffd280;
    }

    footer {
      margin-top: 24px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }

    @media (min-width: 768px) {
      h1#page-title {
        font-size: 30px;
      }
      p#page-intro {
        font-size: 15px;
      }
    }

    function applyLang(lang) {
      const pack = langPack[lang] || langPack.vi;

      document.getElementById("page-title").innerText = pack.pageTitle;
      document.getElementById("page-intro").innerText = pack.pageIntro;
      document.getElementById("taxi-note-prefix").innerText = pack.taxiNotePrefix + " ";
      document.getElementById("taxi-note-body").innerText = pack.taxiNoteBody;
      document.getElementById("copyright").innerText = pack.copyright;

      const cats = pack.categories;
      document.querySelectorAll(".service-card").forEach(card => {
        const key = card.getAttribute("data-cat");
        const cfg = cats[key];
        if (!cfg) return;
        card.querySelector('[data-role="title"]').innerText = cfg.title;
        card.querySelector('[data-role="sub"]').innerText = cfg.sub;
        card.querySelector('[data-role="badge"]').innerText = cfg.badge;
      });

      document.querySelectorAll(".lang-switch button").forEach(btn =>
        btn.classList.remove("active")
      );
      const activeBtn = document.getElementById("btn-" + lang);
      if (activeBtn) activeBtn.classList.add("active");

      try {
        localStorage.setItem(STORAGE_LANG_KEY, lang);
      } catch (e) {
        console.warn("[Tranmarket] Cannot save lang", e);
      }

      document.documentElement.setAttribute("lang", lang === "vi" ? "vi" : lang);
    }

    function switchLang(lang) {
      applyLang(lang);
    }

    document.addEventListener("DOMContentLoaded", () => {
      let initialLang = "vi";
      try {
        const stored = localStorage.getItem(STORAGE_LANG_KEY);
        if (stored && langPack[stored]) initialLang = stored;
      } catch (e) {
        console.warn("[Tranmarket] Cannot read lang", e);
      }
      applyLang(initialLang);
    });
  </script>
