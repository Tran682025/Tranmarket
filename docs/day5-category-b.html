<script>
  const langPack = {
    vi: {
      pageTitle: "Chọn hạng mục dịch vụ bạn cần",
      pageIntro:
        "Dưới đây là 18 hạng mục dịch vụ phổ biến cho người Việt tại Séc & EU. Hãy chọn hạng mục phù hợp với nhu cầu của bạn. Sau đó trang chi tiết (Day 6) sẽ mở ra với nhà cung cấp đã được Tranmarket kiểm tra & KYB.",
      taxiBadge: "Ví dụ: Taxi Tranmarket – Liberec",
      copyright:
        "© 2025 TRANMARKET Web3 Services — Bảo lưu mọi quyền."
    },
    cz: {
      pageTitle: "Vyberte kategorii služby",
      pageIntro:
        "Níže je 18 kategorií služeb oblíbených mezi vietnamskou komunitou v ČR a EU. Vyberte kategorii, která nejlépe odpovídá vašim potřebám. Poté se otevře detail (Day 6) s poskytovateli ověřenými Tranmarketem a KYB.",
      taxiBadge: "Příklad: Taxi Tranmarket – Liberec",
      copyright:
        "© 2025 TRANMARKET Web3 Services — Všechna práva vyhrazena."
    },
    en: {
      pageTitle: "Choose the service category you need",
      pageIntro:
        "Below are 18 service categories commonly used by Vietnamese in Czechia & the EU. Pick the category that fits your needs. Then a detailed page (Day 6) will open with providers verified by Tranmarket & KYB.",
      taxiBadge: "Example: Taxi Tranmarket – Liberec",
      copyright:
        "© 2025 TRANMARKET Web3 Services — All rights reserved."
    }
  };

  function switchLang(lang) {
    const p = langPack[lang] || langPack.vi;
    if (!p) return;

    const map = {
      "page-title": p.pageTitle,
      "page-intro": p.pageIntro,
      "taxi-badge": p.taxiBadge,
      "copyright": p.copyright
    };

    for (const id in map) {
      const el = document.getElementById(id);
      if (el) el.innerText = map[id];
    }

    document.querySelectorAll(".lang-switch button").forEach(btn =>
      btn.classList.remove("active")
    );
    const activeBtn = document.getElementById("btn-" + lang);
    if (activeBtn) activeBtn.classList.add("active");
  }

  // Mặc định mở tiếng Việt sau khi DOM sẵn sàng
  document.addEventListener("DOMContentLoaded", () => {
    switchLang("vi");
  });
</script>
